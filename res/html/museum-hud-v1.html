<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박물관 현재 임무</title><style>*{box-sizing:border-box}body{margin:0;padding:5px;font:13px system-ui;color:#fff;background:transparent}.panel{padding:8px;border:1px solid #d8b86d;border-radius:13px;background:#17283eed;box-shadow:0 3px 12px #0004}button{border:0;background:transparent;color:white;cursor:pointer;font:inherit}#go{width:100%;padding:0}small{display:block;color:#f2dca6;margin-top:3px;font-size:10px}.row{text-align:right;margin-top:4px}.row button{font-size:10px;text-decoration:underline}button:focus-visible{outline:2px solid #ffe2a0}#confirm{text-align:center;font-size:11px}#confirm button{padding:4px;font-size:11px}</style><div class="panel"><div id="normal"><button id="go">현재 임무 이어하기<small id="state">박물관 지키미 · 불러오는 중</small></button><div class="row"><button id="restart">처음부터 다시</button></div></div><div id="confirm" hidden>내 박물관 진행을 초기화할까요?<br><button id="yes">초기화하고 시작</button><button id="no">취소</button></div></div><script>const $=id=>document.getElementById(id);$('go').onclick=()=>parent.postMessage({type:'museum:continue'},'*');$('restart').onclick=()=>{$('normal').hidden=true;$('confirm').hidden=false;};$('no').onclick=()=>{$('normal').hidden=false;$('confirm').hidden=true;};$('yes').onclick=()=>{parent.postMessage({type:'museum:restart-confirmed'},'*');$('normal').hidden=false;$('confirm').hidden=true;};window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='museum:hud')return;$('state').textContent=e.data.count+'/7 · '+e.data.title;});parent.postMessage({type:'museum:ready'},'*');</script></html>
