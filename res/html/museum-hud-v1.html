<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박물관 탐험 안내</title>
<style>*{box-sizing:border-box}body{margin:0;padding:4px;font:12px system-ui;color:white;background:transparent}.panel{padding:7px;border:1px solid #d8b86d;border-radius:12px;background:#17283eed}button{border:0;background:transparent;color:white;cursor:pointer;font:inherit;touch-action:manipulation}#interact{display:block;width:100%;min-height:30px;background:#34546a;border-radius:6px}small{display:block;color:#f2dca6;font-size:10px;margin:3px 0}.row{display:flex;justify-content:space-between}.row button{font-size:10px;padding:3px}button:focus-visible{outline:2px solid #ffe2a0}#confirm{font-size:11px}#confirm button{min-height:30px}</style>
<div class="panel"><div id="normal"><button id="interact">주변 NPC 대화</button><small id="state">NPC 가까이 걸어가세요</small><div class="row"><button id="go">임무 위치 안내</button><button id="restart">처음부터 다시</button></div></div><div id="confirm" hidden>내 박물관 진행을 초기화할까요?<br><button id="yes">초기화하고 시작</button><button id="no">취소</button></div></div>
<script>const $=id=>document.getElementById(id);$('interact').onclick=()=>parent.postMessage({type:'museum:interact'},'*');$('go').onclick=()=>parent.postMessage({type:'museum:continue'},'*');$('restart').onclick=()=>{$('normal').hidden=true;$('confirm').hidden=false;};$('no').onclick=()=>{$('normal').hidden=false;$('confirm').hidden=true;};$('yes').onclick=()=>{parent.postMessage({type:'museum:restart-confirmed'},'*');$('normal').hidden=false;$('confirm').hidden=true;};window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='museum:hud')return;$('state').textContent=e.data.count+'/7 · '+e.data.title;});parent.postMessage({type:'museum:ready'},'*');</script></html>
