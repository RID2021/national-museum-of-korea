<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission Quiz</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f3029;
        --muted: #617169;
        --panel-a: #fffdf5;
        --panel-b: #eaf2e8;
        --line: rgba(60, 92, 78, 0.18);
        --gold: #f0c34d;
        --green: #3f7a57;
        --red: #b95c55;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background: transparent;
        color: var(--ink);
        font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
        overflow: hidden;
      }

      .panel {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 12px;
        padding: 18px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.96), transparent 32%),
          linear-gradient(145deg, var(--panel-a), var(--panel-b));
        border: 1px solid rgba(255, 255, 255, 0.78);
        box-shadow:
          0 18px 34px rgba(24, 42, 35, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          inset 0 -12px 24px rgba(61, 105, 81, 0.08);
        text-align: center;
      }

      .topbar {
        position: relative;
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge {
        min-height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 13px;
        border-radius: 999px;
        background: rgba(240, 195, 77, 0.22);
        color: #816222;
        font-size: 12px;
        font-weight: 900;
      }

      .close {
        position: absolute;
        top: 0;
        right: 0;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(229, 238, 226, 0.88));
        color: #365047;
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        box-shadow:
          0 4px 10px rgba(31, 48, 41, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .title {
        margin: 0 36px;
        color: var(--green);
        font-size: 18px;
        font-weight: 900;
        line-height: 1.3;
        word-break: keep-all;
      }

      .question {
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(239, 246, 237, 0.72));
        border: 1px solid var(--line);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 7px 18px rgba(47, 78, 65, 0.1);
        font-size: 18px;
        font-weight: 900;
        line-height: 1.42;
        word-break: keep-all;
      }

      .options {
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .option {
        min-height: 58px;
        border: 1px solid rgba(60, 92, 78, 0.18);
        border-radius: 8px;
        background:
          linear-gradient(180deg, #ffffff, #f0f6ed);
        color: var(--ink);
        font-size: 15px;
        font-weight: 900;
        line-height: 1.28;
        word-break: keep-all;
        cursor: pointer;
        box-shadow:
          0 6px 14px rgba(36, 67, 52, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .option:hover {
        border-color: rgba(63, 122, 87, 0.38);
        background: linear-gradient(180deg, #fffef8, #e9f3e6);
      }

      .option.is-correct {
        border-color: rgba(63, 122, 87, 0.54);
        background: linear-gradient(180deg, #e8f6dd, #cbe8c2);
        color: #235139;
      }

      .option.is-wrong {
        border-color: rgba(185, 92, 85, 0.48);
        background: linear-gradient(180deg, #fff2ed, #efd1ca);
        color: #7d3732;
      }

      .result {
        min-height: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 11px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.54);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.34;
        word-break: keep-all;
      }

      .result-title {
        color: var(--ink);
        font-size: 15px;
        font-weight: 900;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .action {
        min-width: 108px;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(180deg, #4e8d67, #32694b);
        color: #ffffff;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
        box-shadow:
          0 7px 14px rgba(46, 88, 63, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }

      .action.secondary {
        background: linear-gradient(180deg, #f2d36c, #d7aa3b);
        color: #523d14;
      }

      @media (max-width: 360px) {
        .panel {
          gap: 10px;
          padding: 16px 14px;
        }

        .title {
          margin: 0 34px;
          font-size: 16px;
        }

        .question {
          min-height: 82px;
          font-size: 16px;
        }

        .options {
          grid-template-columns: 1fr;
          gap: 7px;
        }

        .option {
          min-height: 46px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <section class="panel" aria-label="미션 퀴즈">
      <div class="topbar">
        <div class="badge">QUIZ</div>
        <button id="close-button" class="close" type="button" aria-label="닫기">&times;</button>
      </div>
      <h1 id="title" class="title">미션 퀴즈</h1>
      <div id="question" class="question">문제를 불러오는 중입니다.</div>
      <div id="options" class="options"></div>
      <div id="result" class="result">
        <div id="result-title" class="result-title">정답을 선택하세요</div>
        <div id="result-body">퀴즈를 풀면 미션 진행률이 반영됩니다.</div>
      </div>
      <div class="actions">
        <button id="progress-button" class="action secondary" type="button">진행률 보기</button>
        <button id="done-button" class="action" type="button">닫기</button>
      </div>
    </section>
    <script>
      (function () {
        const titleElement = document.getElementById("title");
        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const resultTitleElement = document.getElementById("result-title");
        const resultBodyElement = document.getElementById("result-body");
        const closeButton = document.getElementById("close-button");
        const doneButton = document.getElementById("done-button");
        const progressButton = document.getElementById("progress-button");

        let currentOptions = [];
        let answeredCorrectly = false;

        function post(type, payload) {
          window.parent?.postMessage(Object.assign({ type }, payload || {}), "*");
        }

        function resetResult() {
          answeredCorrectly = false;
          resultTitleElement.textContent = "정답을 선택하세요";
          resultBodyElement.textContent = "퀴즈를 풀면 미션 진행률이 반영됩니다.";
        }

        function renderOptions(options) {
          currentOptions = Array.isArray(options) ? options : [];
          optionsElement.replaceChildren();

          currentOptions.forEach(function (optionText, index) {
            const button = document.createElement("button");
            button.className = "option";
            button.type = "button";
            button.textContent = optionText;
            button.addEventListener("click", function () {
              if (answeredCorrectly) {
                return;
              }

              post("mission-quiz:answer", { optionIndex: index });
            });
            optionsElement.appendChild(button);
          });
        }

        function applyQuiz(payload) {
          titleElement.textContent = payload?.title || "미션 퀴즈";
          questionElement.textContent = payload?.question || "문제를 불러오지 못했습니다.";
          renderOptions(payload?.options || []);
          resetResult();
        }

        function applyResult(payload) {
          const selectedIndex = Number(payload?.selectedIndex);
          const optionButtons = Array.from(optionsElement.querySelectorAll(".option"));
          optionButtons.forEach(function (button) {
            button.classList.remove("is-correct", "is-wrong");
          });

          if (Number.isFinite(selectedIndex) && optionButtons[selectedIndex]) {
            optionButtons[selectedIndex].classList.add(
              payload?.correct ? "is-correct" : "is-wrong"
            );
          }

          answeredCorrectly = Boolean(payload?.correct);
          resultTitleElement.textContent = payload?.correct ? "정답입니다" : "다시 도전해보세요";
          resultBodyElement.textContent =
            payload?.message || payload?.explanation || "결과를 확인했습니다.";
        }

        function handleMessage(event) {
          const data = event?.data;
          if (!data || typeof data.type !== "string") {
            return;
          }

          if (data.type === "mission-quiz:init") {
            applyQuiz(data.payload || {});
            return;
          }

          if (data.type === "mission-quiz:result") {
            applyResult(data.payload || {});
          }
        }

        closeButton.addEventListener("click", function () {
          post("mission-quiz:close");
        });

        doneButton.addEventListener("click", function () {
          post("mission-quiz:close");
        });

        progressButton.addEventListener("click", function () {
          post("mission-quiz:show-progress");
        });

        window.addEventListener("message", handleMessage);
        post("mission-quiz:ready");
      })();
    </script>
  </body>
</html>
