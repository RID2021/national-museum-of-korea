<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission Progress</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17322a;
        --muted: #65746d;
        --panel-top: #fffdf6;
        --panel-bottom: #e6f0e5;
        --line: rgba(55, 88, 74, 0.16);
        --shadow: rgba(24, 42, 35, 0.24);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background: transparent;
        font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
        overflow: hidden;
      }

      .panel {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 18px 18px 18px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.95), transparent 28%),
          linear-gradient(145deg, var(--panel-top), var(--panel-bottom));
        border: 1px solid rgba(255, 255, 255, 0.76);
        box-shadow:
          0 18px 34px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          inset 0 -10px 24px rgba(79, 120, 96, 0.08);
        color: var(--ink);
        text-align: center;
      }

      .topbar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 28px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(66, 125, 88, 0.12);
        color: #2f684a;
        font-size: 11px;
        font-weight: 800;
      }

      .close-button {
        position: absolute;
        right: 0;
        top: 0;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(226, 236, 224, 0.82));
        color: #345247;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        box-shadow:
          0 3px 8px rgba(23, 50, 42, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .title {
        margin: 10px 34px 8px;
        min-height: 28px;
        color: var(--ink);
        font-size: 22px;
        font-weight: 900;
        line-height: 1.24;
        text-align: center;
        word-break: keep-all;
      }

      .gauge-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }

      .gauge-shadow {
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 132px;
        height: 18px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(29, 55, 45, 0.18);
        filter: blur(6px);
      }

      .gauge {
        position: relative;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: conic-gradient(from -90deg, #e1e9dc 0deg 32deg, rgba(255, 255, 255, 0.75) 32deg 36deg);
        box-shadow:
          0 12px 22px rgba(47, 84, 65, 0.22),
          inset 0 8px 10px rgba(255, 255, 255, 0.62),
          inset 0 -12px 16px rgba(32, 70, 50, 0.22);
      }

      .gauge::before {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 38% 30%, #ffffff 0, #fbfaf3 38%, #e9efe2 100%);
        box-shadow:
          inset 0 5px 10px rgba(255, 255, 255, 0.9),
          inset 0 -8px 16px rgba(75, 105, 88, 0.12),
          0 2px 0 rgba(255, 255, 255, 0.58);
      }

      .gauge::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.38), transparent 44%);
        pointer-events: none;
      }

      .gauge-core {
        position: absolute;
        inset: 24px;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .percent {
        color: #142b24;
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .percent-unit {
        margin-left: 1px;
        font-size: 18px;
        font-weight: 900;
      }

      .status {
        margin-top: 7px;
        color: #456457;
        font-size: 12px;
        font-weight: 800;
      }

      .info {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      .metric {
        box-sizing: border-box;
        min-height: 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 8px;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(237, 244, 235, 0.72));
        border: 1px solid var(--line);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.86),
          0 5px 14px rgba(45, 79, 64, 0.1);
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1.25;
        text-align: center;
      }

      .metric-value {
        margin-top: 5px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 900;
        line-height: 1.25;
        text-align: center;
        word-break: keep-all;
      }

      .next-step {
        width: 100%;
        margin-top: 8px;
        box-sizing: border-box;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(73, 119, 91, 0.96), rgba(49, 86, 68, 0.96));
        border: 1px solid rgba(30, 66, 49, 0.34);
        color: #fffdf6;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        word-break: keep-all;
        cursor: pointer;
        font-family: inherit;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.26),
          0 8px 18px rgba(28, 57, 44, 0.18);
        transition:
          transform 0.14s ease,
          opacity 0.14s ease,
          filter 0.14s ease;
      }

      .next-step:active {
        transform: translateY(1px);
      }

      .next-step.is-locked {
        opacity: 0.58;
        filter: grayscale(0.15);
      }

      @media (max-width: 340px) {
        body {
          padding: 10px;
        }

        .panel {
          padding: 16px 14px;
        }

        .title {
          margin-right: 32px;
          margin-left: 32px;
          font-size: 20px;
        }

        .gauge {
          width: 150px;
          height: 150px;
        }

        .percent {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <section class="panel" aria-label="미션 진행률">
      <div class="topbar">
        <div class="eyebrow">MISSION</div>
        <button id="close-button" class="close-button" type="button" aria-label="닫기">&times;</button>
      </div>
      <div id="title" class="title">현재 미션</div>
      <div class="gauge-wrap">
        <div class="gauge-shadow"></div>
        <div id="gauge" class="gauge">
          <div class="gauge-core">
            <div class="percent">
              <span id="percent">0</span><span class="percent-unit">%</span>
            </div>
            <div id="status" class="status">진행 중</div>
          </div>
        </div>
      </div>
      <div class="info">
        <div class="metric">
          <div class="metric-label">완료 단계</div>
          <div id="detail" class="metric-value">0/6</div>
        </div>
      </div>
      <button id="museum-button" class="next-step" type="button">국립중앙박물관으로 이동하기</button>
    </section>
    <script>
      (function () {
        const gaugeElement = document.getElementById("gauge");
        const titleElement = document.getElementById("title");
        const percentElement = document.getElementById("percent");
        const statusElement = document.getElementById("status");
        const detailElement = document.getElementById("detail");
        const museumButton = document.getElementById("museum-button");
        const closeButton = document.getElementById("close-button");

        const activeColors = [
          "#f7c84b",
          "#f8d653",
          "#ead856",
          "#cfdc69",
          "#a9cd76",
          "#82b96e",
          "#5f9f61",
          "#477f50",
          "#315f3e",
          "#1f3f2d",
        ];
        const inactiveColor = "#dfe9dc";
        const gapColor = "rgba(255, 255, 255, 0.78)";

        function clampPercent(value) {
          const numberValue = Number(value);
          if (!Number.isFinite(numberValue)) {
            return 0;
          }

          return Math.max(0, Math.min(100, Math.round(numberValue)));
        }

        function buildSegmentedGradient(percent) {
          const activeCount = Math.round(clampPercent(percent) / 10);
          const segments = [];

          for (let index = 0; index < 10; index += 1) {
            const start = index * 36;
            const segmentEnd = start + 31.5;
            const end = (index + 1) * 36;
            const color = index < activeCount ? activeColors[index] : inactiveColor;

            segments.push(`${color} ${start}deg ${segmentEnd}deg`);
            segments.push(`${gapColor} ${segmentEnd}deg ${end}deg`);
          }

          return `conic-gradient(from -90deg, ${segments.join(", ")})`;
        }

        function setText(element, value, fallback) {
          element.textContent = typeof value === "string" && value.trim()
            ? value.trim()
            : fallback;
        }

        function applyPayload(payload) {
          const percent = clampPercent(payload?.percent);

          titleElement.textContent = payload?.title || "현재 미션";
          percentElement.textContent = String(percent);
          gaugeElement.style.background = buildSegmentedGradient(percent);
          setText(statusElement, payload?.status, "진행 중");
          setText(detailElement, payload?.detail, "0/6");
          setText(
            museumButton,
            payload?.museumButtonLabel || payload?.nextStepLabel,
            "국립중앙박물관으로 이동하기"
          );
          const isUnlocked = Boolean(payload?.museumUnlocked);
          museumButton.classList.toggle("is-locked", !isUnlocked);
          museumButton.setAttribute("aria-disabled", isUnlocked ? "false" : "true");
        }

        function handleMessage(event) {
          const data = event?.data;
          if (!data || data.type !== "mission-progress:init") {
            return;
          }

          applyPayload(data.payload || {});
        }

        closeButton.addEventListener("click", function () {
          window.parent?.postMessage({ type: "mission-progress:close" }, "*");
        });

        museumButton.addEventListener("click", function () {
          window.parent?.postMessage({ type: "mission-progress:open-museum" }, "*");
        });

        window.addEventListener("message", handleMessage);
        window.parent?.postMessage({ type: "mission-progress:ready" }, "*");
      })();
    </script>
  </body>
</html>
