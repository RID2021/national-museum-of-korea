<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory</title>
  <style>
    :root {
      --warm-base: #ffeeb0;
      --panel-bg: linear-gradient(180deg, #fff8dc 0%, var(--warm-base) 62%, #f7dd92 100%);
      --panel-border: rgba(190, 150, 67, 0.62);
      --slot-bg: linear-gradient(180deg, #fffcef 0%, #fff2c7 100%);
      --slot-border: rgba(194, 152, 66, 0.55);
      --text-main: #4f3e1f;
      --text-muted: #78602f;
      --accent: #d7a83c;
      --button-bg: linear-gradient(180deg, #ffe18b 0%, #efc25b 100%);
      --button-bg-disabled: linear-gradient(180deg, #efe2b9 0%, #dbc790 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    body {
      background: rgba(108, 85, 33, 0.25);
      padding: 4px 12px;
    }

    .inventory {
      width: 100%;
      height: 100%;
    }

    .inventory__panel {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      box-shadow: 0 16px 30px rgba(99, 72, 23, 0.3);
      display: grid;
      grid-template-rows: 62px 1fr 78px;
      overflow: hidden;
    }

    .inventory__header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(122, 95, 38, 0.22);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0));
    }

    .inventory__title {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .inventory__close {
      position: absolute;
      top: 12px;
      right: 8px;
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      border: 1px solid rgba(138, 104, 36, 0.36);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #6f5120;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .inventory__close-hitbox {
      position: absolute;
      top: 4px;
      right: 0;
      width: 56px;
      height: 56px;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .inventory__grid {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
    }

    .inventory__slot {
      position: relative;
      min-width: 0;
      border: 1px solid var(--slot-border);
      border-radius: 12px;
      background: var(--slot-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 -5px 10px rgba(153, 120, 51, 0.16);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: default;
      color: var(--text-main);
    }

    .inventory__slot--filled {
      cursor: pointer;
    }

    .inventory__slot--empty {
      opacity: 0.82;
    }

    .inventory__slot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .inventory__image {
      width: 62%;
      aspect-ratio: 1 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 8px;
    }

    .inventory__name {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: 11px;
      line-height: 1.2;
      min-height: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inventory__qty {
      position: absolute;
      right: 8px;
      bottom: 8px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid rgba(163, 127, 52, 0.45);
      background: rgba(255, 234, 176, 0.96);
      color: #6f4f1d;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
    }

    .inventory__tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translate(-50%, 8px);
      width: min(230px, 65vw);
      border-radius: 10px;
      border: 1px solid rgba(176, 131, 46, 0.45);
      background: rgba(255, 246, 220, 0.98);
      padding: 10px;
      color: #4f3e1f;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: 0 10px 24px rgba(120, 88, 28, 0.28);
      z-index: 8;
    }

    .inventory__slot--filled:hover .inventory__tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .inventory__tooltip img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .inventory__tooltip-title {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .inventory__tooltip-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(79, 62, 31, 0.88);
    }

    .inventory__footer {
      border-top: 1px solid rgba(122, 95, 38, 0.2);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(204, 162, 73, 0.12));
    }

    .inventory__nav {
      height: 46px;
      border: 1px solid rgba(161, 124, 48, 0.45);
      border-radius: 10px;
      background: var(--button-bg);
      color: #5a4016;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .inventory__nav:disabled {
      cursor: default;
      background: var(--button-bg-disabled);
      color: rgba(94, 73, 38, 0.52);
      border-color: rgba(120, 93, 38, 0.25);
    }

    .inventory__page {
      margin: 0;
      min-width: 62px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section class="inventory">
    <div class="inventory__panel">
      <header class="inventory__header">
        <h1 class="inventory__title">인벤토리</h1>
        <button type="button" class="inventory__close-hitbox" data-close-hit aria-label="닫기"></button>
        <button type="button" class="inventory__close" data-close aria-label="닫기">×</button>
      </header>

      <div class="inventory__grid" data-grid></div>

      <footer class="inventory__footer">
        <button type="button" class="inventory__nav" data-prev aria-label="이전">이전</button>
        <p class="inventory__page" data-page>1 / 1</p>
        <button type="button" class="inventory__nav" data-next aria-label="다음">다음</button>
      </footer>
    </div>
  </section>

  <script>
    const PAGE_SIZE = 12;
    const GRID_COLS = 3;
    const GRID_ROWS = 4;

    const state = {
      items: [],
      pageIndex: 0,
    };

    const grid = document.querySelector('[data-grid]');
    const prevButton = document.querySelector('[data-prev]');
    const closeButton = document.querySelector('[data-close]');
    const closeHitboxButton = document.querySelector('[data-close-hit]');
    const nextButton = document.querySelector('[data-next]');
    const pageLabel = document.querySelector('[data-page]');

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAppAssetUrl(fileName) {
      try {
        const url = new URL(window.location.href);
        const appHashId = url.searchParams.get('appHashId');
        const appUpdatedAt = url.searchParams.get('appUpdatedAt');

        if (appHashId) {
          const params = new URLSearchParams({
            appHashId,
            fileName,
          });

          if (appUpdatedAt) {
            params.set('appUpdatedAt', appUpdatedAt);
          }

          return `${url.origin}/spaces/app/file?${params.toString()}`;
        }
      } catch (_error) {
        // Local previews can use the relative fallback below.
      }

      return `../${fileName}`;
    }

    function resolveAssetUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) {
        return '';
      }
      if (/^(?:https?:|data:|blob:)/i.test(raw)) {
        return raw;
      }

      const fileName = raw
        .replace(/^(\.\.\/)+/, '')
        .replace(/^(\.\/)+/, '')
        .replace(/^\/+/, '');

      return getAppAssetUrl(fileName);
    }

    function toCssUrl(value) {
      const sanitized = resolveAssetUrl(value).replace(/"/g, '\\"');
      return `url("${sanitized}")`;
    }

    function getPageCount() {
      return Math.max(1, Math.ceil(state.items.length / PAGE_SIZE));
    }

    function getPageStart() {
      return state.pageIndex * PAGE_SIZE;
    }

    function buildSlots() {
      const total = GRID_ROWS * GRID_COLS;
      const start = getPageStart();
      const pageItems = state.items.slice(start, start + total);

      const slots = [];
      for (let index = 0; index < total; index += 1) {
        slots.push(pageItems[index] ?? null);
      }
      return slots;
    }

    function updatePager() {
      const pageCount = getPageCount();
      const hasMultiplePages = state.items.length > PAGE_SIZE;
      if (pageLabel) {
        pageLabel.textContent = `${state.pageIndex + 1} / ${pageCount}`;
      }
      if (prevButton) {
        prevButton.disabled = !hasMultiplePages;
      }
      if (nextButton) {
        nextButton.disabled = !hasMultiplePages;
      }
    }

    function renderItems() {
      const slots = buildSlots();
      grid.innerHTML = '';

      slots.forEach((item) => {
        const slot = document.createElement('article');
        slot.className = 'inventory__slot';

        if (item) {
          slot.classList.add('inventory__slot--filled');
          const imageUrl = item.imageUrl ? resolveAssetUrl(item.imageUrl) : '';

          const image = document.createElement('div');
          image.className = 'inventory__image';
          if (imageUrl) {
            image.style.backgroundImage = toCssUrl(imageUrl);
          }

          const name = document.createElement('p');
          name.className = 'inventory__name';
          name.textContent = item.name;

          slot.appendChild(image);
          slot.appendChild(name);

          if (item.quantity && item.quantity > 1) {
            const qty = document.createElement('span');
            qty.className = 'inventory__qty';
            qty.textContent = String(item.quantity);
            slot.appendChild(qty);
          }

          const tooltip = document.createElement('aside');
          tooltip.className = 'inventory__tooltip';
          tooltip.innerHTML = `
            ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(item.name)}" />` : ''}
            <h3 class="inventory__tooltip-title">${escapeHtml(item.name)}</h3>
            <p class="inventory__tooltip-desc">${escapeHtml(item.description || '설명이 없습니다.')}</p>
          `;
          slot.appendChild(tooltip);
        } else {
          slot.classList.add('inventory__slot--empty');
        }

        grid.appendChild(slot);
      });

      updatePager();
    }

    function movePage(direction) {
      if (state.items.length <= PAGE_SIZE) {
        return;
      }

      const pageCount = getPageCount();
      state.pageIndex = (state.pageIndex + direction + pageCount) % pageCount;
      renderItems();
    }

    function updateInventory(payload) {
      if (!payload) {
        return;
      }

      if (Array.isArray(payload.items)) {
        state.items = payload.items.map((item) => ({
          name: String(item.name || ''),
          imageUrl: String(item.imageUrl || ''),
          description: String(item.description || ''),
          quantity: Math.max(1, Number(item.quantity) || 0),
        }));
      }

      const pageCount = getPageCount();
      if (state.pageIndex >= pageCount) {
        state.pageIndex = 0;
      }

      renderItems();
    }

    function handleMessage(event) {
      let message = event?.data;
      if (typeof message === 'string') {
        try {
          message = JSON.parse(message);
        } catch (_error) {
          return;
        }
      }

      if (!message || (message.type !== 'inventory:init' && message.type !== 'inventory:update')) {
        return;
      }

      updateInventory(message.payload);
    }

    function requestClose() {
      window.parent?.postMessage({ type: 'inventory:close' }, '*');
      if (typeof window.ZEPWidget !== 'undefined' && typeof window.ZEPWidget.close === 'function') {
        window.ZEPWidget.close();
      }
    }

    prevButton?.addEventListener('click', function () {
      movePage(-1);
    });

    closeButton?.addEventListener('click', function (event) {
      event.preventDefault();
      requestClose();
    });

    closeButton?.addEventListener('touchend', function (event) {
      event.preventDefault();
      requestClose();
    }, { passive: false });

    closeHitboxButton?.addEventListener('click', function (event) {
      event.preventDefault();
      requestClose();
    });

    closeHitboxButton?.addEventListener('touchend', function (event) {
      event.preventDefault();
      requestClose();
    }, { passive: false });

    nextButton?.addEventListener('click', function () {
      movePage(1);
    });

    window.addEventListener('message', handleMessage);

    renderItems();
  </script>
</body>
</html>
