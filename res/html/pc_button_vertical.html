<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    img {
      width: 80px;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: rgba(35, 35, 35, 0.92);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      min-width: 88px;
    }
  </style>
</head>

<body>
  <div style="display: flex; flex-direction: column; gap: 5px;">
    <img onclick="openTask()" src="https://legacy-rid.gcdn.ntruss.com/zep-script/history_josun/ms_t.png" />
    <img onclick="openInventory()"
      src="https://legacy-rid.gcdn.ntruss.com/zep-script/history_josun/inventory_icon.png" />
    <button type="button" onclick="openMinimap()">미니맵(M)</button>
  </div>
  <script>
    function openTask() {
      window.parent.postMessage(
        {
          openTask: true,
        },
        "*"
      );
    }
    function openInventory() {
      window.parent.postMessage(
        {
          openInventory: true,
        },
        "*"
      );
    }
    function openMinimap() {
      window.parent.postMessage(
        {
          openMinimap: true,
        },
        "*"
      );
    }
  </script>
</body>

</html>
