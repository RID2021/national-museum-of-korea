<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Mobile</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: transparent
    }

    .inventory {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      /* gap: 18px; */
      align-items: center;
    }


    .inventory__panel {
      position: relative;
      width: 350px;
      aspect-ratio: 500 / 650;
      background: url("https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/inventory_backplate2.png") center / contain no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15% 0 35% 0;
      box-sizing: border-box;
    }

    .inventory__header {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .inventory__title {
      margin: 0;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
    }

    .inventory__size {
      margin: 0;
      font-size: 12px;
      color: rgba(255, 237, 209, 0.75);
    }

    .inventory__grid {
      --inventory-cols: 3;
      width: 70%;
      display: grid;
      grid-template-columns: repeat(var(--inventory-cols), 1fr);
      grid-auto-rows: 1fr;
      gap: 15px;
    }

    .inventory__slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      padding: 0;
      background: transparent;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
    }

    .inventory__slot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/item_backplate.png") center / cover no-repeat;
      border-radius: 18px;
      pointer-events: none;
      z-index: 0;
    }

    .inventory__slot::after {
      content: "";
      position: absolute;
      inset: 0;
      /* border-radius: 18px; */
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0));
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: 2;
    }

    .inventory__slot--empty:hover::after,
    .inventory__slot--empty:active::after {
      opacity: 0.45;
    }

    .inventory__slot--filled:hover::after,
    .inventory__slot--filled:active::after,
    .inventory__slot[data-active="true"]::after {
      opacity: 0.24;
    }

    .inventory__slot-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width:100%;
      height:100%;
      position: relative;
      z-index: 1;
    }

    .inventory__image {
      margin-top: 10%;
      width: 80%;
      aspect-ratio: 1.25 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .inventory__quantity {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(32, 24, 18, 0.85);
      color: #ffe2a6;
      font-size: 11px;
      font-weight: 600;
      display: none;
      z-index: 3;
    }

    .inventory__slot[data-has-quantity="true"] .inventory__quantity {
      display: inline-flex;
    }

    .inventory__name {
      margin: 0;
      font-size: 10px;
      font-weight: 400;
      color: #ffe2a6;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .inventory__close {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 60px;
      border: none;
      background: url("https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/exit_button.png") center / contain no-repeat;
      color: transparent;
      cursor: pointer;
    }

    .inventory__details {
      width: 350px;
      background: rgba(32, 24, 18, 0.75);
      border: 1px solid rgba(255, 206, 150, 0.25);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
    }

    .inventory__details-empty {
      margin: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 237, 209, 0.7);
    }

    .inventory__details-image {
      width: 100%;
      max-height: 160px;
      border-radius: 12px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.25);
    }

    .inventory__details-name {
      margin: 6px 0 0;
      font-size: 16px;
      font-weight: 700;
    }

    .inventory__details-desc {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 237, 209, 0.85);
    }
  </style>
</head>

<body>
  <section class="inventory">
    <div class="inventory__panel">
      <header class="inventory__header">
      </header>
      <div class="inventory__grid" data-grid></div>
      <button type="button" class="inventory__close" data-close aria-label="닫기"></button>
    </div>

    <!--
      <section class="inventory__details" data-details>
        <p class="inventory__details-empty" data-details-empty>아이템을 선택하면 정보가 표시됩니다.</p>
        <img class="inventory__details-image" data-details-image hidden alt="선택된 아이템 이미지" />
        <h2 class="inventory__details-name" data-details-name hidden></h2>
        <p class="inventory__details-desc" data-details-desc hidden></p>
      </section>
      -->
  </section>
  <script>
    const FALLBACK_SLOT_IMAGE = 'https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/item_backplate.png';

    const state = {
      size: { rows: 4, cols: 3 },
      items: [],
      activeIndex: -1,
    };

    const grid = document.querySelector('[data-grid]');
    const sizeLabel = document.querySelector('[data-size]');
    const closeButton = document.querySelector('[data-close]');
    const detailEmpty = document.querySelector('[data-details-empty]');
    const detailImage = document.querySelector('[data-details-image]');
    const detailName = document.querySelector('[data-details-name]');
    const detailDesc = document.querySelector('[data-details-desc]');

    function toCssUrl(value) {
      const sanitized = String(value).replace(/"/g, '\\"');
      return `url("${sanitized}")`;
    }

    function buildSlots() {
      const rows = Math.max(4, Number(state.size.rows) || 1);
      const cols = Math.max(3, Number(state.size.cols) || 1);
      const total = rows * cols;

      grid.style.setProperty('--inventory-cols', String(cols));

      const slots = [];
      for (let index = 0; index < total; index += 1) {
        slots.push(state.items[index] ?? null);
      }
      return slots;
    }

    // function setDetails(item) {
    //   if (!item) {
    //     detailEmpty.hidden = false;
    //     detailName.hidden = true;
    //     detailDesc.hidden = true;
    //     detailImage.hidden = true;
    //     detailName.textContent = '';
    //     detailDesc.textContent = '';
    //     detailImage.src = '';
    //     return;
    //   }

    //   detailEmpty.hidden = true;
    //   detailName.hidden = false;
    //   detailDesc.hidden = false;
    //   detailName.textContent = item.name;
    //   detailDesc.textContent = item.description || '설명이 없습니다.';

    //   if (item.imageUrl) {
    //     detailImage.hidden = false;
    //     detailImage.src = item.imageUrl;
    //   } else {
    //     detailImage.hidden = true;
    //     detailImage.src = '';
    //   }
    // }

    function renderSlots() {
      const slots = buildSlots();
      grid.innerHTML = '';

      slots.forEach((item, index) => {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'inventory__slot';

        if (item) {
          slot.classList.add('inventory__slot--filled');

          if (item.quantity && item.quantity > 1) {
            slot.dataset.hasQuantity = 'true';
          }

          const content = document.createElement('div');
          content.className = 'inventory__slot-content';

          const image = document.createElement('div');
          image.className = 'inventory__image';
          image.style.backgroundImage = toCssUrl(item.imageUrl || FALLBACK_SLOT_IMAGE);

          const name = document.createElement('p');
          name.className = 'inventory__name';
          name.textContent = item.name;

          content.appendChild(image);
          content.appendChild(name);
          slot.appendChild(content);

          const quantity = document.createElement('span');
          quantity.className = 'inventory__quantity';
          // quantity.textContent = `×${item.quantity}`;
          // slot.appendChild(quantity);
        } else {
          slot.classList.add('inventory__slot--empty');
        }

        if (index === state.activeIndex) {
          slot.dataset.active = 'true';
        }

        slot.addEventListener('click', () => {
          if (!item) {
            return;
          }

          state.activeIndex = index;
          // setDetails(item);
          renderSlots();
        });

        grid.appendChild(slot);
      });
    }


    function updateInventory(payload) {
      if (!payload) {
        return;
      }

      if (payload.size) {
        state.size = {
          rows: Math.max(1, parseInt(payload.size.rows, 10) || 1),
          cols: Math.max(1, parseInt(payload.size.cols, 10) || 1),
        };
      }
      if (Array.isArray(payload.items)) {
        state.items = payload.items.map((item) => ({
          name: String(item.name || ''),
          imageUrl: String(item.imageUrl || ''),
          description: String(item.description || ''),
          quantity: Math.max(1, Number(item.quantity) || 0),
        }));
      }

      if (!state.items.length) {
        state.activeIndex = -1;
        // setDetails(undefined);
      } else if (state.activeIndex < 0 || state.activeIndex >= state.items.length) {
        state.activeIndex = 0;
        // setDetails(state.items[0]);
      } else {
        // setDetails(state.items[state.activeIndex]);
      }

      renderSlots();
    }

    function handleMessage(event) {
      if (!event || typeof event.data === 'undefined') {
        return;
      }

      let message = event.data;

      if (typeof message === 'string') {
        try {
          message = JSON.parse(message);
        } catch (_error) {
          return;
        }
      }

      if (!message || (message.type !== 'inventory:init' && message.type !== 'inventory:update')) {
        return;
      }
      console.log(message.payload)
      updateInventory(message.payload);
    }

    function requestClose() {
      if (typeof window.ZEPWidget !== 'undefined' && typeof window.ZEPWidget.close === 'function') {
        window.ZEPWidget.close();
        return;
      }
      window.parent?.postMessage({ type: 'inventory:close' }, '*');
    }

    closeButton?.addEventListener('click', requestClose);
    window.addEventListener('message', handleMessage);

    // setDetails(undefined);
    renderSlots();
  </script>
</body>

</html>
