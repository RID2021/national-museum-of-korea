<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Mobile</title>
  <style>
    :root {
      --panel-bg: linear-gradient(180deg, #2a2220 0%, #1b1615 100%);
      --panel-border: rgba(222, 169, 120, 0.45);
      --slot-bg: linear-gradient(180deg, #4a413e 0%, #37302e 100%);
      --slot-border: rgba(229, 187, 147, 0.38);
      --text-main: #f8e7cf;
      --text-muted: #d8bd97;
      --accent: #f0bf80;
      --button-bg: linear-gradient(180deg, #8f6746 0%, #6e4d35 100%);
      --button-bg-disabled: linear-gradient(180deg, #5b5048 0%, #4c443e 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: transparent;
      color: var(--text-main);
    }

    body {
      padding: 8px;
    }

    .inventory {
      width: 100%;
      height: 100%;
    }

    .inventory__panel {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.38);
      display: grid;
      grid-template-rows: 56px 1fr 68px;
      overflow: hidden;
    }

    .inventory__header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
    }

    .inventory__title {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .inventory__close {
      position: absolute;
      top: 10px;
      right: 6px;
      width: 34px;
      height: 34px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff2df;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .inventory__grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 10px;
      min-height: 0;
    }

    .inventory__slot {
      position: relative;
      min-width: 0;
      border: 1px solid var(--slot-border);
      border-radius: 12px;
      background: var(--slot-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -4px 8px rgba(0, 0, 0, 0.28);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: default;
      color: var(--text-main);
    }

    .inventory__slot--filled {
      cursor: pointer;
    }

    .inventory__slot--empty {
      opacity: 0.82;
    }

    .inventory__slot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .inventory__image {
      width: 68%;
      aspect-ratio: 1 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 8px;
    }

    .inventory__name {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inventory__qty {
      position: absolute;
      right: 6px;
      bottom: 6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 12, 10, 0.8);
      color: #f4d6ad;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    .inventory__footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.2));
    }

    .inventory__nav {
      height: 42px;
      border: 1px solid rgba(255, 237, 214, 0.28);
      border-radius: 10px;
      background: var(--button-bg);
      color: #fff1db;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .inventory__nav:disabled {
      cursor: default;
      background: var(--button-bg-disabled);
      color: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .inventory__page {
      margin: 0;
      min-width: 56px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section class="inventory">
    <div class="inventory__panel">
      <header class="inventory__header">
        <h1 class="inventory__title">인벤토리</h1>
        <button type="button" class="inventory__close" data-close aria-label="닫기">×</button>
      </header>

      <div class="inventory__grid" data-grid></div>

      <footer class="inventory__footer">
        <button type="button" class="inventory__nav" data-prev aria-label="이전">이전</button>
        <p class="inventory__page" data-page>1 / 1</p>
        <button type="button" class="inventory__nav" data-next aria-label="다음">다음</button>
      </footer>
    </div>
  </section>

  <script>
    const PAGE_SIZE = 12;
    const GRID_COLS = 3;
    const GRID_ROWS = 4;

    const state = {
      items: [],
      pageIndex: 0,
    };

    const grid = document.querySelector('[data-grid]');
    const prevButton = document.querySelector('[data-prev]');
    const closeButton = document.querySelector('[data-close]');
    const nextButton = document.querySelector('[data-next]');
    const pageLabel = document.querySelector('[data-page]');

    function toCssUrl(value) {
      const sanitized = String(value).replace(/"/g, '\\"');
      return `url("${sanitized}")`;
    }

    function getPageCount() {
      return Math.max(1, Math.ceil(state.items.length / PAGE_SIZE));
    }

    function getPageStart() {
      return state.pageIndex * PAGE_SIZE;
    }

    function buildSlots() {
      const total = GRID_ROWS * GRID_COLS;
      const start = getPageStart();
      const pageItems = state.items.slice(start, start + total);

      const slots = [];
      for (let index = 0; index < total; index += 1) {
        slots.push(pageItems[index] ?? null);
      }
      return slots;
    }

    function updatePager() {
      const pageCount = getPageCount();
      const hasMultiplePages = state.items.length > PAGE_SIZE;
      if (pageLabel) {
        pageLabel.textContent = `${state.pageIndex + 1} / ${pageCount}`;
      }
      if (prevButton) {
        prevButton.disabled = !hasMultiplePages;
      }
      if (nextButton) {
        nextButton.disabled = !hasMultiplePages;
      }
    }

    function renderSlots() {
      const slots = buildSlots();
      grid.innerHTML = '';

      slots.forEach((item) => {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'inventory__slot';

        if (item) {
          slot.classList.add('inventory__slot--filled');

          const image = document.createElement('div');
          image.className = 'inventory__image';
          image.style.backgroundImage = item.imageUrl ? toCssUrl(item.imageUrl) : '';

          const name = document.createElement('p');
          name.className = 'inventory__name';
          name.textContent = item.name;

          slot.appendChild(image);
          slot.appendChild(name);

          if (item.quantity && item.quantity > 1) {
            const qty = document.createElement('span');
            qty.className = 'inventory__qty';
            qty.textContent = String(item.quantity);
            slot.appendChild(qty);
          }
        } else {
          slot.classList.add('inventory__slot--empty');
          slot.disabled = true;
        }

        grid.appendChild(slot);
      });

      updatePager();
    }

    function movePage(direction) {
      if (state.items.length <= PAGE_SIZE) {
        return;
      }

      const pageCount = getPageCount();
      state.pageIndex = (state.pageIndex + direction + pageCount) % pageCount;
      renderSlots();
    }

    function updateInventory(payload) {
      if (!payload) {
        return;
      }

      if (Array.isArray(payload.items)) {
        state.items = payload.items.map((item) => ({
          name: String(item.name || ''),
          imageUrl: String(item.imageUrl || ''),
          description: String(item.description || ''),
          quantity: Math.max(1, Number(item.quantity) || 0),
        }));
      }

      const pageCount = getPageCount();
      if (state.pageIndex >= pageCount) {
        state.pageIndex = 0;
      }

      renderSlots();
    }

    function handleMessage(event) {
      let message = event?.data;

      if (typeof message === 'string') {
        try {
          message = JSON.parse(message);
        } catch (_error) {
          return;
        }
      }

      if (!message || (message.type !== 'inventory:init' && message.type !== 'inventory:update')) {
        return;
      }

      updateInventory(message.payload);
    }

    function requestClose() {
      if (typeof window.ZEPWidget !== 'undefined' && typeof window.ZEPWidget.close === 'function') {
        window.ZEPWidget.close();
        return;
      }

      window.parent?.postMessage({ type: 'inventory:close' }, '*');
    }

    prevButton?.addEventListener('click', function () {
      movePage(-1);
    });

    closeButton?.addEventListener('click', requestClose);

    nextButton?.addEventListener('click', function () {
      movePage(1);
    });

    window.addEventListener('message', handleMessage);

    renderSlots();
  </script>
</body>
</html>
