<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Mobile</title>
  <style>
    :root {
      --warm-base: #ffeeb0;
      --panel-bg: linear-gradient(180deg, #fff8dc 0%, var(--warm-base) 62%, #f7dd92 100%);
      --panel-border: rgba(190, 150, 67, 0.62);
      --slot-bg: linear-gradient(180deg, #fffcef 0%, #fff2c7 100%);
      --slot-border: rgba(194, 152, 66, 0.55);
      --text-main: #4f3e1f;
      --text-muted: #78602f;
      --accent: #d7a83c;
      --button-bg: linear-gradient(180deg, #ffe18b 0%, #efc25b 100%);
      --button-bg-disabled: linear-gradient(180deg, #efe2b9 0%, #dbc790 100%);
      --inventory-body-padding: 9px;
      --inventory-panel-max-width: 540px;
      --inventory-header-height: 62px;
      --inventory-footer-height: 62px;
      --inventory-content-pad-top: 6px;
      --inventory-content-pad-x: 13px;
      --inventory-content-pad-bottom: 8px;
      --inventory-title-size: 21px;
      --inventory-close-size: 37px;
      --inventory-close-top: 10px;
      --inventory-close-right: 6px;
      --inventory-close-font-size: 24px;
      --inventory-footer-pad-top: 7px;
      --inventory-footer-pad-x: 13px;
      --inventory-footer-pad-bottom: 9px;
      --inventory-footer-gap: 13px;
      --inventory-nav-height: 39px;
      --inventory-nav-min-width: 112px;
      --inventory-nav-pad-x: 13px;
      --inventory-nav-font-size: 18px;
      --inventory-page-font-size: 14px;
      --inventory-page-min-width: 44px;
      --inventory-image-width: 68%;
      --inventory-slot-pad-y: 6px;
      --inventory-slot-pad-x: 6px;
      --inventory-slot-gap: 4px;
      --inventory-name-size: 11px;
      --inventory-name-line-height: 1.2;
      --inventory-grid-gap: 10;
      --inventory-slot-min: 57;
      --inventory-rail-ratio: 0.94;
      --inventory-grid-min-width: calc(var(--inventory-slot-min) * 3 + var(--inventory-grid-gap) * 2);
      --inventory-grid-min-height: calc(var(--inventory-slot-min) * 3 + var(--inventory-grid-gap) * 2);
      --inventory-footer-min-width: calc(var(--inventory-nav-min-width) * 2 + var(--inventory-page-min-width) + var(--inventory-footer-gap) * 2);
    }

    @media (max-width: 1024px) {
      :root {
        --inventory-panel-max-width: 388px;
        --inventory-header-height: 55px;
        --inventory-footer-height: 53px;
        --inventory-content-pad-top: 5px;
        --inventory-content-pad-x: 10px;
        --inventory-content-pad-bottom: 6px;
        --inventory-title-size: 18px;
        --inventory-close-size: 33px;
        --inventory-close-top: 8px;
        --inventory-close-right: 5px;
        --inventory-close-font-size: 22px;
        --inventory-footer-pad-top: 6px;
        --inventory-footer-pad-x: 10px;
        --inventory-footer-pad-bottom: 7px;
        --inventory-footer-gap: 9px;
        --inventory-nav-height: 35px;
        --inventory-nav-min-width: 92px;
        --inventory-nav-pad-x: 10px;
        --inventory-nav-font-size: 16px;
        --inventory-page-font-size: 12px;
        --inventory-page-min-width: 38px;
        --inventory-image-width: 66%;
        --inventory-slot-pad-y: 5px;
        --inventory-slot-pad-x: 6px;
        --inventory-slot-gap: 3px;
        --inventory-name-size: 10px;
        --inventory-name-line-height: 1.2;
        --inventory-grid-gap: 8;
        --inventory-slot-min: 47;
        --inventory-rail-ratio: 0.955;
      }
    }

    @media (max-width: 768px) {
      :root {
        --inventory-panel-max-width: 360px;
        --inventory-header-height: 54px;
        --inventory-footer-height: 52px;
        --inventory-content-pad-top: 5px;
        --inventory-content-pad-x: 10px;
        --inventory-content-pad-bottom: 6px;
        --inventory-title-size: 17px;
        --inventory-close-size: 32px;
        --inventory-close-top: 8px;
        --inventory-close-right: 5px;
        --inventory-close-font-size: 22px;
        --inventory-footer-pad-top: 6px;
        --inventory-footer-pad-x: 10px;
        --inventory-footer-pad-bottom: 7px;
        --inventory-footer-gap: 8px;
        --inventory-nav-height: 34px;
        --inventory-nav-min-width: 88px;
        --inventory-nav-pad-x: 10px;
        --inventory-nav-font-size: 16px;
        --inventory-page-font-size: 11px;
        --inventory-page-min-width: 38px;
        --inventory-image-width: 64%;
        --inventory-slot-pad-y: 5px;
        --inventory-slot-pad-x: 5px;
        --inventory-slot-gap: 3px;
        --inventory-name-size: 10px;
        --inventory-name-line-height: 1.2;
        --inventory-grid-gap: 8;
        --inventory-slot-min: 46;
        --inventory-rail-ratio: 0.97;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: transparent;
      color: var(--text-main);
    }

    body {
      padding: var(--inventory-body-padding);
    }

    .inventory {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .inventory__panel {
      width: min(100%, var(--inventory-panel-max-width));
      height: 100%;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      box-shadow: 0 14px 24px rgba(99, 72, 23, 0.28);
      display: grid;
      grid-template-rows:
        var(--inventory-header-height)
        minmax(0, 1fr)
        var(--inventory-footer-height);
      overflow: hidden;
    }

    .inventory__header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(122, 95, 38, 0.22);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0));
    }

    .inventory__title {
      margin: 0;
      font-size: var(--inventory-title-size);
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .inventory__close {
      position: absolute;
      top: var(--inventory-close-top);
      right: var(--inventory-close-right);
      width: var(--inventory-close-size);
      height: var(--inventory-close-size);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      border: 1px solid rgba(138, 104, 36, 0.36);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #6f5120;
      font-size: var(--inventory-close-font-size);
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .inventory__close-hitbox {
      position: absolute;
      top: 2px;
      right: 0;
      width: 54px;
      height: 54px;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .inventory__content {
      min-height: 0;
      padding:
        var(--inventory-content-pad-top)
        var(--inventory-content-pad-x)
        var(--inventory-content-pad-bottom);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inventory__content-rail {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inventory__grid-stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .inventory__grid {
      --grid-gap: 10px;
      --slot-size: 90px;
      display: grid;
      grid-template-columns: repeat(3, var(--slot-size));
      grid-template-rows: repeat(3, var(--slot-size));
      gap: var(--grid-gap);
      justify-content: center;
      align-content: center;
    }

    .inventory__slot {
      position: relative;
      width: var(--slot-size);
      height: var(--slot-size);
      border: 1px solid var(--slot-border);
      border-radius: 12px;
      background: var(--slot-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 -4px 8px rgba(153, 120, 51, 0.16);
      padding: var(--inventory-slot-pad-y) var(--inventory-slot-pad-x);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      color: var(--text-main);
    }

    .inventory__slot-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--inventory-slot-gap);
      padding: 0;
      overflow: hidden;
    }

    .inventory__slot--filled {
      cursor: pointer;
    }

    .inventory__slot--empty {
      opacity: 0.82;
    }

    .inventory__slot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .inventory__image {
      width: var(--inventory-image-width);
      max-width: 100%;
      max-height: calc(
        100% -
        (var(--inventory-name-size) * var(--inventory-name-line-height)) -
        var(--inventory-slot-gap)
      );
      aspect-ratio: 1 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 8px;
      flex: 0 1 auto;
    }

    .inventory__name {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: var(--inventory-name-size);
      line-height: var(--inventory-name-line-height);
      min-height: calc(var(--inventory-name-size) * var(--inventory-name-line-height));
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
    }

    .inventory__qty {
      position: absolute;
      right: 6px;
      bottom: 6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid rgba(163, 127, 52, 0.45);
      background: rgba(255, 234, 176, 0.96);
      color: #6f4f1d;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    .inventory__footer {
      border-top: 1px solid rgba(122, 95, 38, 0.2);
      display: grid;
      align-items: center;
      justify-items: center;
      padding:
        var(--inventory-footer-pad-top)
        var(--inventory-footer-pad-x)
        var(--inventory-footer-pad-bottom);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(204, 162, 73, 0.12));
    }

    .inventory__footer-inner {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--inventory-footer-gap);
    }

    .inventory__nav {
      height: var(--inventory-nav-height);
      min-height: var(--inventory-nav-height);
      min-width: var(--inventory-nav-min-width);
      flex: 0 0 auto;
      padding: 0 var(--inventory-nav-pad-x);
      border: 1px solid rgba(161, 124, 48, 0.45);
      border-radius: 10px;
      background: var(--button-bg);
      color: #5a4016;
      font-size: var(--inventory-nav-font-size);
      font-weight: 700;
      cursor: pointer;
    }

    .inventory__nav:disabled {
      cursor: default;
      background: var(--button-bg-disabled);
      color: rgba(94, 73, 38, 0.52);
      border-color: rgba(120, 93, 38, 0.25);
    }

    .inventory__page {
      margin: 0;
      min-width: var(--inventory-page-min-width);
      text-align: center;
      font-size: var(--inventory-page-font-size);
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <section class="inventory">
    <div class="inventory__panel">
      <header class="inventory__header">
        <h1 class="inventory__title">인벤토리</h1>
        <button type="button" class="inventory__close-hitbox" data-close-hit aria-label="닫기"></button>
        <button type="button" class="inventory__close" data-close aria-label="닫기">×</button>
      </header>

      <div class="inventory__content">
        <div class="inventory__content-rail" data-content-rail>
          <div class="inventory__grid-stage" data-grid-stage>
            <div class="inventory__grid" data-grid></div>
          </div>
        </div>
      </div>

      <footer class="inventory__footer">
        <div class="inventory__footer-inner" data-footer-inner>
          <button type="button" class="inventory__nav" data-prev aria-label="이전">이전</button>
          <p class="inventory__page" data-page>1 / 1</p>
          <button type="button" class="inventory__nav" data-next aria-label="다음">다음</button>
        </div>
      </footer>
    </div>
  </section>

  <script>
    const PAGE_SIZE = 9;
    const GRID_COLS = 3;
    const GRID_ROWS = 3;
    const GRID_GAP = 10;
    const MIN_SLOT_SIZE = 56;
    const CONTENT_WIDTH_RATIO = 0.94;
    const GRID_HORIZONTAL_BUFFER = 2;

    const state = {
      items: [],
      pageIndex: 0,
    };

    const contentArea = document.querySelector('.inventory__content');
    const footerArea = document.querySelector('.inventory__footer');
    const contentRail = document.querySelector('[data-content-rail]');
    const footerInner = document.querySelector('[data-footer-inner]');
    const gridStage = document.querySelector('[data-grid-stage]');
    const grid = document.querySelector('[data-grid]');
    const prevButton = document.querySelector('[data-prev]');
    const closeButton = document.querySelector('[data-close]');
    const closeHitboxButton = document.querySelector('[data-close-hit]');
    const nextButton = document.querySelector('[data-next]');
    const pageLabel = document.querySelector('[data-page]');

    function readLayoutNumber(variableName, fallback) {
      const computed = getComputedStyle(document.documentElement);
      const rawValue = computed.getPropertyValue(variableName).trim();
      const parsed = Number.parseFloat(rawValue);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function updateGridSizing() {
      if (!grid || !gridStage || !contentRail || !footerInner) {
        return;
      }

      const gridGap = readLayoutNumber('--inventory-grid-gap', GRID_GAP);
      const minSlotSize = readLayoutNumber('--inventory-slot-min', MIN_SLOT_SIZE);
      const rawRailRatio = readLayoutNumber('--inventory-rail-ratio', CONTENT_WIDTH_RATIO);
      const railRatio = Math.min(1, Math.max(0.7, rawRailRatio));
      const navMinWidth = readLayoutNumber('--inventory-nav-min-width', 88);
      const pageMinWidth = readLayoutNumber('--inventory-page-min-width', 38);
      const footerGap = readLayoutNumber('--inventory-footer-gap', gridGap);

      const contentHostWidth = contentArea?.clientWidth ?? gridStage.clientWidth;
      const footerHostWidth = footerArea?.clientWidth ?? contentHostWidth;
      const hostWidth = Math.floor(Math.min(contentHostWidth, footerHostWidth));
      const hostHeight = contentArea?.clientHeight ?? gridStage.clientHeight;
      if (hostWidth <= 0 || hostHeight <= 0) {
        return;
      }

      const fallbackGridMinWidth = minSlotSize * GRID_COLS + gridGap * (GRID_COLS - 1);
      const fallbackFooterMinWidth = navMinWidth * 2 + pageMinWidth + footerGap * 2;
      const minGridWidth = readLayoutNumber('--inventory-grid-min-width', fallbackGridMinWidth);
      const minFooterWidth = readLayoutNumber('--inventory-footer-min-width', fallbackFooterMinWidth);
      const requiredMinWidth = Math.max(minGridWidth, minFooterWidth);
      const targetRailWidth = Math.floor(hostWidth * railRatio);
      const railWidth = Math.min(hostWidth, Math.max(requiredMinWidth, targetRailWidth));

      contentRail.style.width = '100%';
      footerInner.style.width = '100%';
      contentRail.style.maxWidth = `${railWidth}px`;
      footerInner.style.maxWidth = `${railWidth}px`;

      const usableWidth = Math.min(contentRail.clientWidth, railWidth);
      const usableHeight = gridStage.clientHeight;
      if (usableWidth <= 0 || usableHeight <= 0) {
        return;
      }

      const widthBased =
        (usableWidth - gridGap * (GRID_COLS - 1) - GRID_HORIZONTAL_BUFFER) / GRID_COLS;
      const heightBased = (usableHeight - gridGap * (GRID_ROWS - 1)) / GRID_ROWS;
      if (!Number.isFinite(widthBased) || !Number.isFinite(heightBased)) {
        return;
      }
      const fitSize = Math.floor(Math.min(widthBased, heightBased));
      const slotSize = Number.isFinite(fitSize) && fitSize > 0 ? fitSize : 1;

      grid.style.setProperty('--grid-gap', `${gridGap}px`);
      grid.style.setProperty('--slot-size', `${slotSize}px`);
    }

    function toCssUrl(value) {
      const sanitized = String(value).replace(/"/g, '\\"');
      return `url("${sanitized}")`;
    }

    function getPageCount() {
      return Math.max(1, Math.ceil(state.items.length / PAGE_SIZE));
    }

    function getPageStart() {
      return state.pageIndex * PAGE_SIZE;
    }

    function buildSlots() {
      const total = GRID_ROWS * GRID_COLS;
      const start = getPageStart();
      const pageItems = state.items.slice(start, start + total);

      const slots = [];
      for (let index = 0; index < total; index += 1) {
        slots.push(pageItems[index] ?? null);
      }
      return slots;
    }

    function updatePager() {
      const pageCount = getPageCount();
      const hasMultiplePages = state.items.length > PAGE_SIZE;
      if (pageLabel) {
        pageLabel.textContent = `${state.pageIndex + 1} / ${pageCount}`;
      }
      if (prevButton) {
        prevButton.disabled = !hasMultiplePages;
      }
      if (nextButton) {
        nextButton.disabled = !hasMultiplePages;
      }
    }

    function renderSlots() {
      const slots = buildSlots();
      grid.innerHTML = '';

      slots.forEach((item) => {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'inventory__slot';

        if (item) {
          slot.classList.add('inventory__slot--filled');
          const content = document.createElement('div');
          content.className = 'inventory__slot-content';

          const image = document.createElement('div');
          image.className = 'inventory__image';
          image.style.backgroundImage = item.imageUrl ? toCssUrl(item.imageUrl) : '';

          const name = document.createElement('p');
          name.className = 'inventory__name';
          name.textContent = item.name;

          content.appendChild(image);
          content.appendChild(name);
          slot.appendChild(content);

          if (item.quantity && item.quantity > 1) {
            const qty = document.createElement('span');
            qty.className = 'inventory__qty';
            qty.textContent = String(item.quantity);
            slot.appendChild(qty);
          }
        } else {
          slot.classList.add('inventory__slot--empty');
          slot.disabled = true;
        }

        grid.appendChild(slot);
      });

      updateGridSizing();
      updatePager();
    }

    function movePage(direction) {
      if (state.items.length <= PAGE_SIZE) {
        return;
      }

      const pageCount = getPageCount();
      state.pageIndex = (state.pageIndex + direction + pageCount) % pageCount;
      renderSlots();
    }

    function updateInventory(payload) {
      if (!payload) {
        return;
      }

      if (Array.isArray(payload.items)) {
        state.items = payload.items.map((item) => ({
          name: String(item.name || ''),
          imageUrl: String(item.imageUrl || ''),
          description: String(item.description || ''),
          quantity: Math.max(1, Number(item.quantity) || 0),
        }));
      }

      const pageCount = getPageCount();
      if (state.pageIndex >= pageCount) {
        state.pageIndex = 0;
      }

      renderSlots();
    }

    function handleMessage(event) {
      let message = event?.data;

      if (typeof message === 'string') {
        try {
          message = JSON.parse(message);
        } catch (_error) {
          return;
        }
      }

      if (!message || (message.type !== 'inventory:init' && message.type !== 'inventory:update')) {
        return;
      }

      updateInventory(message.payload);
    }

    function requestClose() {
      window.parent?.postMessage({ type: 'inventory:close' }, '*');
      if (typeof window.ZEPWidget !== 'undefined' && typeof window.ZEPWidget.close === 'function') {
        window.ZEPWidget.close();
      }
    }

    prevButton?.addEventListener('click', function () {
      movePage(-1);
    });

    closeButton?.addEventListener('click', function (event) {
      event.preventDefault();
      requestClose();
    });

    closeButton?.addEventListener('touchend', function (event) {
      event.preventDefault();
      requestClose();
    }, { passive: false });

    closeHitboxButton?.addEventListener('click', function (event) {
      event.preventDefault();
      requestClose();
    });

    closeHitboxButton?.addEventListener('touchend', function (event) {
      event.preventDefault();
      requestClose();
    }, { passive: false });

    nextButton?.addEventListener('click', function () {
      movePage(1);
    });

    window.addEventListener('resize', updateGridSizing);
    window.addEventListener('orientationchange', updateGridSizing);
    window.addEventListener('message', handleMessage);

    if (typeof ResizeObserver !== 'undefined') {
      const layoutObserver = new ResizeObserver(updateGridSizing);
      if (contentArea) {
        layoutObserver.observe(contentArea);
      }
      if (footerArea) {
        layoutObserver.observe(footerArea);
      }
      if (gridStage) {
        layoutObserver.observe(gridStage);
      }
    }

    renderSlots();
    updateGridSizing();
  </script>
</body>
</html>
