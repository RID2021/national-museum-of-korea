<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박물관 미션</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font:16px/1.5 system-ui,sans-serif;color:#1b2c3d}main{height:100vh;display:flex;flex-direction:column;background:#f8f5ed;border:2px solid #c3a362;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #0005}header{background:#182d42;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}small{color:#e3c78d}button,input{font:inherit}button{cursor:pointer;border:1px solid #c8b891;border-radius:12px;background:white;color:#1b2c3d;padding:12px;min-height:46px}button:hover{background:#fff0c9}button:focus-visible,input:focus-visible{outline:3px solid #2282b0;outline-offset:2px}button:disabled{opacity:.55;cursor:default;background:#d9e7d9}.selected{outline:3px solid #b48124;background:#fff0c9}#close{background:transparent;color:white;border-color:#8292a0;padding:4px 10px}section{padding:16px 22px;overflow:auto;flex:1}#prompt{font-weight:650;margin:0 0 12px}#hint,#note{font-size:13px;color:#586572;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.order,.memory{grid-template-columns:repeat(4,minmax(0,1fr))}.memory button{min-height:82px}.mapPuzzle{grid-template-columns:repeat(2,minmax(0,1fr));max-width:300px;margin:auto;gap:4px}.mapPuzzle button{padding:0;overflow:hidden;line-height:0;border-radius:5px}.mapPuzzle svg{width:100%;height:87px}.reference{padding:10px;background:#eee6d5;font-size:13px;margin:10px 0;border-radius:8px}.map{position:relative;width:270px;height:265px;margin:auto}.map svg{height:100%;width:100%}.map button{position:absolute;min-height:28px;font-size:11px;padding:3px 5px;transform:translate(-50%,-50%);white-space:nowrap}.map button.seen{background:#cbe6ce}#feedback{padding:10px 14px;margin:10px 0 0;background:#e7eef2;border-radius:9px;min-height:44px;font-size:14px}footer{padding:10px 22px;border-top:1px solid #ddd3c2;display:flex;gap:10px;align-items:center}#submit{background:#234763;color:white;flex:1}input{width:100%;padding:12px;border:1px solid #9aabbb;border-radius:10px}.conveyor{background:repeating-linear-gradient(90deg,#d7dce0 0px,#d7dce0 24px,#c4cbd0 25px,#c4cbd0 28px);padding:12px;animation:belt 5s linear infinite}.conveyor button{min-height:70px}@keyframes belt{to{background-position:112px 0}}@media(prefers-reduced-motion:reduce){.conveyor{animation:none}}@media(max-width:420px){header{padding:10px 14px}h1{font-size:17px}section{padding:12px}footer{padding:8px 12px}.grid{gap:6px}.order,.memory{grid-template-columns:repeat(2,minmax(0,1fr))}button{font-size:14px;padding:8px}.memory button{min-height:64px}}
button{touch-action:manipulation}input{font-size:16px;user-select:text;-webkit-user-select:text}section{min-height:0;-webkit-overflow-scrolling:touch}header,footer{flex-shrink:0}.answer-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.answer-keys button{min-height:44px;padding:8px}.answer-help{font-size:12px;margin:8px 0;color:#586572}
.order button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;position:relative}.brick-art{width:100%;height:140px;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}.brick-name{font-size:14px;overflow-wrap:anywhere}.brick-position{align-self:flex-start;font-size:11px;color:#586572}.order .selected{box-shadow:inset 0 0 0 2px #b48124}.order .selected .brick-position{color:#805000;font-weight:bold}@media(max-width:420px){.brick-art{height:108px}.brick-name{font-size:12px}.order button{padding:5px;gap:2px}}@media(max-height:500px){.brick-art{height:90px}}
.brick-frame{display:block;position:relative;overflow:hidden;width:104px;height:140px;flex:none;touch-action:none;cursor:grab}.brick-frame .brick-art{position:absolute;max-width:none;object-fit:fill;height:auto;width:auto}.dragging{opacity:.45}.drop-target{outline:3px dashed #2282b0}.brick-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);margin:0}@media(max-width:420px){.brick-frame{width:80px;height:108px}}@media(max-height:500px){.brick-frame{width:67px;height:90px}}
</style></head><body><main><header><div><small id="number">박물관 지키미</small><h1 id="title">미션을 불러오는 중…</h1></div><button id="close" aria-label="미션 닫기">닫기</button></header><section><p id="prompt"></p><p id="hint"></p><div id="board"></div><p id="note"></p><div id="feedback" role="status" aria-live="polite">잠시 기다려 주세요.</div></section><footer><span style="font-size:12px">진행 자동 저장</span><button id="submit" hidden>확인</button></footer></main>
<script>
/* BRICK_ASSETS */
const BRICK_BOUNDS={'산수문전':[61,53,193,212],'산수봉황문전':[48,29,207,231],'산수귀문전':[53,41,203,217],'연대귀문전':[53,31,203,227],'연화문전':[45,32,212,230],'와운문전':[47,31,209,234],'반룡문전':[54,37,202,224],'봉황문전':[49,28,207,234]};
let cancelBrickDrag=()=>{};
let suppressBrickClickUntil=0;
function bindBrickDrag(button,frame,index){
  let drag=null;
  function clean(){
    if(!drag)return;
    const d=drag;drag=null;
    d.ghost?.remove();button.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(b=>b.classList.remove('drop-target'));
    if(frame.hasPointerCapture(d.id))frame.releasePointerCapture(d.id);
  }
  frame.onpointerdown=e=>{
    if(busy||!e.isPrimary||e.button!==0)return;
    cancelBrickDrag();cancelBrickDrag=clean;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,token:view.token,revision:view.revision};
    frame.setPointerCapture(e.pointerId);
  };
  frame.onpointermove=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;
    e.preventDefault();
    if(!drag.ghost){
      drag.ghost=frame.cloneNode(true);drag.ghost.classList.add('brick-ghost');
      const rect=frame.getBoundingClientRect();
      drag.ghost.style.width=rect.width+'px';drag.ghost.style.height=rect.height+'px';
      document.body.append(drag.ghost);button.classList.add('dragging');
    }
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const section=document.querySelector('section'),rect=section.getBoundingClientRect();
    if(e.clientY<rect.top+35)section.scrollTop-=14;
    if(e.clientY>rect.bottom-35)section.scrollTop+=14;
    document.querySelectorAll('.drop-target').forEach(b=>b.classList.remove('drop-target'));
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-brick-index]');
    if(target&&target!==button)target.classList.add('drop-target');
  };
  frame.onpointerup=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-brick-index]');
    if(d.ghost){suppressBrickClickUntil=Date.now()+500;e.preventDefault();}
    clean();
    if(d.ghost&&target&&target!==button&&view.token===d.token&&view.revision===d.revision)
      send({kind:'swap',index,target:Number(target.dataset.brickIndex)});
  };
  frame.onpointercancel=()=>{suppressBrickClickUntil=Date.now()+500;clean();};
  frame.onlostpointercapture=clean;
}
let view=null,busy=false,answerDraft='',composing=false,recoveryTimer=null;const $=id=>document.getElementById(id);
const shape='<path d="M185 8 L158 30 165 53 145 66 151 85 127 100 117 126 91 133 83 151 64 158 68 175 54 185 66 199 61 216 80 222 74 239 93 246 100 264 127 257 139 240 155 231 158 207 169 185 161 166 170 145 166 126 181 109 185 91 197 72 193 49 211 30 205 13 Z" fill="#a6b9a0" stroke="#456752" stroke-width="3"/>';
function mapSvg(vb='0 0 240 280'){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" aria-label="학습용 한반도 개략도"><rect width="240" height="280" fill="#e2eef2"/>'+shape+'</svg>';}
function send(action){if(!view||busy)return;if(action.kind==='answer'&&!action.text.trim()){$('feedback').textContent='입력칸을 눌러 정답 두 글자를 직접 입력해 주세요.';return;}busy=true;parent.postMessage({type:'museum:action',token:view.token,revision:view.revision,action},'*');clearTimeout(recoveryTimer);recoveryTimer=setTimeout(()=>{busy=false;$('feedback').textContent='응답을 다시 확인하고 있어요. 잠시 후 다시 눌러 주세요.';parent.postMessage({type:'museum:ready'},'*');},4000);}
function submitAnswer(){if(composing)return;const input=$('answer');if(input){answerDraft=input.value;send({kind:'answer',text:answerDraft});}}
function render(v){if(view&&view.token===v.token&&v.revision<view.revision)return;const keepInput=view&&view.mission===v.mission&&view.kind==='answer'&&v.kind==='answer'&&$('answer');if(!view||view.mission!==v.mission||view.kind!==v.kind)answerDraft='';view=v;busy=false;clearTimeout(recoveryTimer);$('title').textContent=v.title;$('number').textContent='MISSION '+v.mission+' / 7';$('prompt').textContent=v.prompt||'';$('hint').textContent=v.hint||'';$('note').textContent=v.note||'';$('feedback').textContent=v.feedback||'천천히 살펴보고 도전해 보세요.';$('submit').hidden=!v.submit&&v.kind!=='answer';$('submit').textContent=v.submit||'정답 확인';if(keepInput)return;composing=false;cancelBrickDrag();const board=$('board');board.replaceChildren();
if(v.reference){const ref=document.createElement('div');ref.className='reference';ref.textContent='복원 안내: '+v.reference;board.append(ref);}
if(v.kind==='answer'){const input=document.createElement('input');input.id='answer';input.type='text';input.inputMode='text';input.placeholder='여기를 눌러 두 글자 정답 입력';input.maxLength=20;input.autocomplete='off';input.enterKeyHint='done';input.value=answerDraft;input.setAttribute('aria-label','관계 추론 정답');if(v.mobile){input.readOnly=true;input.onclick=()=>parent.postMessage({type:'museum:input',token:view.token},'*');}else{input.onpointerup=()=>input.focus();input.ontouchend=()=>input.focus();}input.oninput=()=>{answerDraft=input.value;};input.oncompositionstart=()=>{composing=true;};input.oncompositionend=()=>{composing=false;answerDraft=input.value;};input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&!composing){e.preventDefault();submitAnswer();}};board.append(input);}
else if(v.kind==='locations'){const map=document.createElement('div');map.className='map';map.innerHTML=mapSvg();v.places.forEach((p,i)=>{const b=document.createElement('button');b.textContent=(v.visited.includes(i)?'✓ ':'')+p.name;b.className=v.visited.includes(i)?'seen':'';b.style.left=p.x+'%';b.style.top=p.y+'%';b.onclick=()=>send({kind:'pick',index:i});map.append(b);});board.append(map);$('note').textContent='위치는 개략적입니다. 경계선은 특정 시기의 정확한 국경을 뜻하지 않습니다.';}
else{if(v.kind==='mapPuzzle'){const ref=document.createElement('div');ref.className='reference';ref.innerHTML='<span>참고 지도 · 학습용 개략도</span><div style="width:70px;height:80px;display:inline-block;vertical-align:middle">'+mapSvg()+'</div>';board.append(ref);}
const grid=document.createElement('div');grid.className='grid '+v.kind;(v.items||[]).forEach((item,i)=>{const b=document.createElement('button');b.disabled=(v.disabled||[]).includes(i);if(v.selected===i)b.classList.add('selected');if(v.kind==='mapPuzzle'){const x=(item%2)*120,y=Math.floor(item/2)*280/3;b.innerHTML=mapSvg(x+' '+y+' 120 '+(280/3));b.setAttribute('aria-label','지도 자리 '+(i+1)+' 조각 '+(item+1));}else{if(v.kind==='order'&&BRICK_ASSETS[item]){const position=document.createElement('span');position.className='brick-position';position.textContent=(i+1)+'번'+(v.selected===i?' · 선택됨':'');const img=document.createElement('img');img.className='brick-art';img.src=BRICK_ASSETS[item];img.alt='';img.draggable=false;const label=document.createElement('span');label.className='brick-name';label.textContent=item;const frame=document.createElement('span');frame.className='brick-frame';const bounds=BRICK_BOUNDS[item],w=bounds[2]-bounds[0],h=bounds[3]-bounds[1];img.style.width=(256/w*100)+'%';img.style.height=(256/h*100)+'%';img.style.left=(-bounds[0]/w*100)+'%';img.style.top=(-bounds[1]/h*100)+'%';frame.append(img);b.dataset.brickIndex=String(i);b.append(position,frame,label);bindBrickDrag(b,frame,i);b.setAttribute('aria-pressed',String(v.selected===i));}else{b.textContent=item;}b.setAttribute('aria-label',(v.kind==='memory'?'카드 '+(i+1)+' ':v.kind==='order'?'자리 '+(i+1)+' ':'')+item);}b.onclick=()=>{if(Date.now()<suppressBrickClickUntil)return;send({kind:'pick',index:i});};grid.append(b);});board.append(grid);}}
$('submit').onclick=()=>{if(!view)return;if(view.kind==='answer')submitAnswer();else send({kind:'submit'});};$('close').onclick=()=>{cancelBrickDrag();clearTimeout(recoveryTimer);if(view)parent.postMessage({type:'museum:close',token:view.token},'*');};window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='museum:game')render(e.data);if(e.data?.type==='museum:answer-draft'&&view?.kind==='answer'&&e.data.token===view.token){answerDraft=String(e.data.text||'');const input=$('answer');if(input)input.value=answerDraft;}});parent.postMessage({type:'museum:ready'},'*');
</script></body></html>
