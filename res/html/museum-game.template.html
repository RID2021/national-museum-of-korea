if(v.reference){const ref=document.createElement('div');if(v.kind==='order'){ref.className='order-guide';const title=document.createElement('span');title.className='order-guide-title';title.textContent='복원 순서';const list=document.createElement('div');list.className='order-guide-list';String(v.reference).split(' → ').forEach((name,i)=>{const step=document.createElement('span');step.className='order-guide-step';step.textContent=(i+1)+'. '+name;step.title=name;list.append(step);});ref.append(title,list);}else{ref.className='reference';ref.textContent='복원 안내: '+v.reference;}board.append(ref);}
if(v.kind==='answer'){const card=document.createElement('div');card.className='answer-card';const evidence=document.createElement('div');evidence.className='answer-evidence';evidence.innerHTML='<span class="answer-kicker">찾아낸 전시 단서</span><div class="answer-seals"><span>廣</span><span>開</span><span>土</span></div><p class="answer-path">고구려의 도움 · 신라 무덤의 호우</p>';const entry=document.createElement('div');entry.className='answer-entry';const label=document.createElement('label');label.htmlFor='answer';label.textContent='두 나라의 관계를 두 글자로 입력하세요';const input=document.createElement('input');input.id='answer';input.type='text';input.inputMode='text';input.placeholder='정답 두 글자';input.maxLength=20;input.autocomplete='off';input.enterKeyHint='done';input.value=answerDraft;input.setAttribute('aria-label','관계 추론 정답');if(v.mobile){input.readOnly=true;input.onclick=()=>parent.postMessage({type:'museum:input',token:view.token},'*');}else{input.onpointerup=()=>input.focus();input.ontouchend=()=>input.focus();}input.oninput=()=>{answerDraft=input.value;};input.oncompositionstart=()=>{composing=true;};input.oncompositionend=()=>{composing=false;answerDraft=input.value;};input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&!composing){e.preventDefault();submitAnswer();}};const meta=document.createElement('div');meta.className='answer-entry-meta';meta.innerHTML='<span>한글로 입력</span><span>Enter로 확인</span>';entry.append(label,input,meta);card.append(evidence,entry);board.append(card);}
else if(v.kind==='locations'){const shell=document.createElement('div');shell.className='location-shell';const mapCard=document.createElement('div');mapCard.className='location-map-card';const mapHeading=document.createElement('div');mapHeading.className='location-map-heading';mapHeading.innerHTML='<span>진흥왕 비석 위치</span><span class="location-progress">'+v.visited.length+' / 5 확인</span>';const map=document.createElement('div');map.className='map';map.innerHTML=mapSvg();const panel=document.createElement('div');panel.className='location-panel';const heading=document.createElement('h2');heading.textContent='비석의 위치를 살펴보세요';const copy=document.createElement('p');copy.className='location-panel-copy';copy.textContent='지도 위 번호나 아래 목록을 누르면 설명을 확인할 수 있어요.';const meter=document.createElement('div');meter.className='location-meter';meter.setAttribute('aria-label','위치 확인 진행률 '+v.visited.length+'/5');const meterFill=document.createElement('span');meterFill.style.width=(v.visited.length/5*100)+'%';meter.append(meterFill);const list=document.createElement('div');list.className='location-list';v.places.forEach((p,i)=>{const seen=v.visited.includes(i),active=v.selected===i;const choose=()=>send({kind:'pick',index:i});const pin=document.createElement('button');pin.type='button';pin.textContent=seen?'✓':String(i+1);pin.className='map-pin'+(seen?' seen':'')+(active?' active':'');pin.style.left=p.x+'%';pin.style.top=p.y+'%';pin.setAttribute('aria-label',(i+1)+'번 '+p.name+(seen?' 확인 완료':''));pin.setAttribute('aria-pressed',String(active));pin.onclick=choose;map.append(pin);const item=document.createElement('button');item.type='button';item.className='location-item'+(seen?' seen':'')+(active?' active':'');item.setAttribute('aria-pressed',String(active));const index=document.createElement('span');index.className='location-index';index.textContent=seen?'✓':String(i+1);const name=document.createElement('span');name.className='location-name';name.textContent=p.name;const state=document.createElement('span');state.className='location-state'+(seen?'':' pending');state.textContent=seen?'✓':'○';item.append(index,name,state);item.onclick=choose;list.append(item);});mapCard.append(mapHeading,map);panel.append(heading,copy,meter,list);shell.append(mapCard,panel);board.append(shell);$('note').textContent='위치는 개략적입니다. 경계선은 특정 시기의 정확한 국경을 뜻하지 않습니다.';}
else{let gridHost=board;if(v.kind==='mapPuzzle'){const shell=document.createElement('div');shell.className='map-puzzle-shell';const ref=document.createElement('div');ref.className='map-reference-card';ref.innerHTML='<div class="map-panel-heading"><span class="map-panel-kicker">완성 모습</span><span class="map-panel-badge">학습용 개략도</span></div><p class="map-panel-copy">지도 윤곽과 산맥·강의 흐름을 비교해 보세요.</p><div class="map-reference-art"><div class="reference-map">'+mapSvg()+'</div></div>';const work=document.createElement('div');work.className='map-work-card';const workHeading=document.createElement('div');workHeading.className='map-work-heading';workHeading.innerHTML='<span>지도 조각 맞추기</span><span>6조각</span>';work.append(workHeading);shell.append(ref,work);board.append(shell);gridHost=work;}
const grid=document.createElement('div');grid.className='grid '+v.kind;if(v.kind==='choices'&&v.mission===1)grid.classList.add('hanja-grid');(v.items||[]).forEach((item,i)=>{const b=document.createElement('button');b.disabled=(v.disabled||[]).includes(i);if(v.selected===i)b.classList.add('selected');if(v.kind==='mapPuzzle'){const pieceWidth=400/2,pieceHeight=594/3,x=(item%2)*pieceWidth,y=Math.floor(item/2)*pieceHeight;b.innerHTML=mapSvg(x+' '+y+' '+pieceWidth+' '+pieceHeight,true);b.dataset.swapIndex=String(i);bindBrickDrag(b,b,i);b.setAttribute('aria-label','지도 자리 '+(i+1)+' 조각 '+(item+1)+' · 다른 자리로 끌어 이동');b.setAttribute('aria-pressed',String(v.selected===i));}else{if(v.kind==='choices'&&v.mission===1&&HANJA_READINGS[item]){b.classList.add('hanja-card');if(b.disabled)b.classList.add('hanja-found');const seal=document.createElement('span');seal.className='hanja-seal';seal.textContent='碑';const glyph=document.createElement('span');glyph.className='hanja-glyph';glyph.textContent=item;const reading=document.createElement('span');reading.className='hanja-reading';reading.textContent=HANJA_READINGS[item];b.append(seal,glyph,reading);}else if(v.kind==='order'&&BRICK_ASSETS[item]){b.dataset.brickTheme=BRICK_THEMES[item]||'teal';const position=document.createElement('span');position.className='brick-position';position.textContent=(i+1)+'번'+(v.selected===i?' · 선택됨':'');const img=document.createElement('img');img.className='brick-art';img.src=BRICK_ASSETS[item];img.alt='';img.draggable=false;const label=document.createElement('span');label.className='brick-name';label.textContent=item;const frame=document.createElement('span');frame.className='brick-frame';const bounds=BRICK_BOUNDS[item],w=bounds[2]-bounds[0],h=bounds[3]-bounds[1];img.style.width=(256/w*100)+'%';img.style.height=(256/h*100)+'%';img.style.left=(-bounds[0]/w*100)+'%';img.style.top=(-bounds[1]/h*100)+'%';frame.append(img);b.dataset.swapIndex=String(i);b.append(position,frame,label);bindBrickDrag(b,frame,i);b.setAttribute('aria-pressed',String(v.selected===i));}else if(v.kind==='conveyor'&&BAG_ITEM_ASSETS[item]){const img=document.createElement('img');img.className='bag-item-art';img.src=BAG_ITEM_ASSETS[item];img.alt='';img.draggable=false;b.append(img);b.dataset.bagLane=String(BAG_FLOW.lanes[i]);b.style.setProperty('--bag-delay',String(bagFlowDelay(i))+'s');}else if(v.kind==='memory'){const card=document.createElement('span');card.className='memory-card';if(item==='?'){b.classList.add('memory-back');card.innerHTML='<span class="memory-emblem">✦</span><span class="memory-label">MUSEUM</span>';}else{const art=MEMORY_CARD_ART[item]||['stele','✦'];b.classList.add('memory-face');b.dataset.memoryTheme=art[0];card.innerHTML='<span class="memory-emblem">'+art[1]+'</span><span class="memory-label">'+item+'</span>';}b.append(card);}else{b.textContent=item;}b.setAttribute('aria-label',(v.kind==='memory'?'카드 '+(i+1)+' ':v.kind==='order'?'자리 '+(i+1)+' ':v.kind==='choices'&&v.mission===1?'한자 카드 ':'')+item+(v.kind==='choices'&&v.mission===1?' '+HANJA_READINGS[item]:''));}b.onclick=()=>{if(Date.now()<suppressBrickClickUntil)return;send({kind:'pick',index:i});};grid.append(b);});gridHost.append(grid);}}
$('submit').onclick=()=>{if(!view)return;if(view.kind==='answer')submitAnswer();else send({kind:'submit'});};$('close').onclick=()=>{if(completionPlaying)return;cancelBrickDrag();clearTimeout(recoveryTimer);if(view)parent.postMessage({type:'museum:close',token:view.token},'*');};window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='museum:game')render(e.data);if(e.data?.type==='museum:complete')showCompletion(e.data);if(e.data?.type==='museum:answer-draft'&&view?.kind==='answer'&&e.data.token===view.token){answerDraft=String(e.data.text||'');const input=$('answer');if(input)input.value=answerDraft;}});parent.postMessage({type:'museum:ready'},'*');
</script></body></html>
