<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Buttons</title>
  <style>
    :root {
      /* anchor=8(bottom-right) 기준 x=145, y=75 */
      --mobile-anchor-offset-x: 145px;
      --mobile-anchor-offset-y: 75px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      pointer-events: none;
    }

    .button-row {
      position: absolute;
      right: var(--mobile-anchor-offset-x);
      bottom: var(--mobile-anchor-offset-y);
      display: flex;
      flex-direction: row;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      pointer-events: auto;
    }

    .action-button {
      border: 0;
      border-radius: 10px;
      background: rgba(35, 35, 35, 0.92);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      cursor: pointer;
      min-width: 96px;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="button-row">
    <button type="button" class="action-button" onclick="openInventory()">인벤토리(I)</button>
    <button type="button" class="action-button" onclick="openShortcut()">바로가기(G)</button>
    <button type="button" class="action-button" onclick="openMinimap()">미니맵(M)</button>
  </div>
  <script>
    function openInventory() {
      window.parent.postMessage(
        {
          openInventory: true,
        },
        "*"
      );
    }

    function openShortcut() {
      window.parent.postMessage(
        {
          openShortcut: true,
        },
        "*"
      );
    }

    function openMinimap() {
      window.parent.postMessage(
        {
          openMinimap: true,
        },
        "*"
      );
    }
  </script>
</body>

</html>
