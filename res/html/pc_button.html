<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    button {
      border: 0;
      border-radius: 10px;
      background: rgba(35, 35, 35, 0.92);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      min-width: 88px;
    }
  </style>
</head>

<body>
  <div style="display: flex; flex-direction: row; gap: 5px; align-items: center;">
    <button type="button" onclick="openInventory()">인벤토리(I)</button>
  </div>
  <script>
    function openTask() {
      window.parent.postMessage(
        {
          openTask: true,
        },
        "*"
      );
    }
    function openInventory() {
      window.parent.postMessage(
        {
          openInventory: true,
        },
        "*"
      );
    }
  </script>
</body>

</html>
