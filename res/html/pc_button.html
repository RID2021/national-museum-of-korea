<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    img {
      width: 80px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div style="display: flex; flex-direction: row; gap: 5px;">
    <img onclick="openTask()"
      src="https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/ms_t.png" />
    <img onclick="openInventory()"
      src="https://igbrtjdwfvvv11213562.cdn.ntruss.com/zep-script/history_josun/inventory_icon.png" />
  </div>
  <script>
    function openTask() {
      window.parent.postMessage(
        {
          openTask: true,
        },
        "*"
      );
    }
    function openInventory() {
      window.parent.postMessage(
        {
          openInventory: true,
        },
        "*"
      );
    }
  </script>
</body>

</html>
