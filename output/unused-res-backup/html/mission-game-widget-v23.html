<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission Web Game</title>
    <style>
      :root {
        --ink: #20322d;
        --muted: #65766f;
        --paper: #fff9e8;
        --panel: #f6f0d9;
        --line: #d8c995;
        --gold: #e0ae32;
        --green: #49745e;
        --red: #ba553e;
        --blue: #3e748c;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: transparent;
        font-family: "Pretendard", "Noto Sans KR", sans-serif;
      }

      button {
        font: inherit;
      }

      .game {
        width: 100%;
        height: 100%;
        padding: 16px;
        color: var(--ink);
      }

      .game__shell {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 2px solid rgba(78, 93, 69, 0.28);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.74), rgba(255, 249, 232, 0.9)),
          radial-gradient(circle at 14% 18%, rgba(224, 174, 50, 0.24), transparent 34%),
          radial-gradient(circle at 88% 78%, rgba(62, 116, 140, 0.22), transparent 28%),
          #ece4c4;
        box-shadow:
          0 18px 34px rgba(35, 47, 39, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }

      .game__shell::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 8px;
        pointer-events: none;
      }

      .game__header {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 18px 20px 10px;
      }

      .game__eyebrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 24px;
        padding: 2px 10px;
        border-radius: 999px;
        background: #e5efd8;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .game__title {
        margin: 8px 0 3px;
        font-size: 30px;
        font-weight: 950;
        line-height: 1.12;
      }

      .game__subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 800;
        line-height: 1.4;
      }

      .game__close {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(86, 107, 93, 0.34);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #51675c;
        font-size: 22px;
        font-weight: 900;
        cursor: pointer;
      }

      .game__hud {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 20px 12px;
      }

      .game__stat {
        min-height: 52px;
        border: 1px solid rgba(136, 114, 63, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
        display: grid;
        place-items: center;
        text-align: center;
      }

      .game__stat-label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
      }

      .game__stat-value {
        display: block;
        margin-top: 3px;
        font-size: 19px;
        font-weight: 950;
      }

      .game__body {
        position: relative;
        z-index: 1;
        height: calc(100% - 166px);
        min-height: 300px;
        margin: 0 20px 18px;
      }

      .game__stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 2px solid rgba(72, 74, 54, 0.22);
        border-radius: 8px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.12)),
          repeating-linear-gradient(
            90deg,
            rgba(70, 92, 72, 0.08) 0,
            rgba(70, 92, 72, 0.08) 1px,
            transparent 1px,
            transparent 84px
          ),
          linear-gradient(180deg, #d9e4cb 0%, #d5c493 50%, #9d714d 100%);
      }

      .game__stage::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 42%;
        background:
          linear-gradient(12deg, rgba(63, 84, 55, 0.28), transparent 58%),
          linear-gradient(180deg, transparent, rgba(78, 52, 37, 0.28));
      }

      .game__target {
        position: absolute;
        width: 92px;
        height: 92px;
        border-radius: 999px;
        background:
          radial-gradient(circle, #fffbe4 0 22%, #c73f34 23% 34%, #fffbe4 35% 48%, #2f695d 49% 61%, #e0ae32 62% 100%);
        color: #26342e;
        font-size: 15px;
        font-weight: 950;
        cursor: pointer;
        box-shadow:
          0 10px 22px rgba(39, 49, 42, 0.26),
          inset 0 0 0 4px rgba(255, 255, 255, 0.55);
        transform: translate(-50%, -50%);
        transition:
          transform 0.12s ease,
          filter 0.12s ease;
        pointer-events: none;
        will-change: left, top;
      }

      .game__target--hit {
        filter: brightness(1.12);
        transform: translate(-50%, -50%) scale(1.12);
      }

      .game__target-name {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
      }

      .hunting__arrow {
        position: absolute;
        left: 14%;
        bottom: 46px;
        width: 92px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, #6d3f22 0 70%, #efe4bc 71% 100%);
        box-shadow: 0 4px 8px rgba(34, 42, 37, 0.22);
        transform: rotate(-12deg);
        opacity: 0;
        pointer-events: none;
      }

      .hunting__arrow::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 50%;
        width: 20px;
        height: 20px;
        background: #d8c995;
        clip-path: polygon(100% 50%, 0 0, 28% 50%, 0 100%);
        transform: translateY(-50%);
      }

      .hunting__arrow::after {
        content: "";
        position: absolute;
        right: -12px;
        top: 50%;
        width: 18px;
        height: 18px;
        background: #455d50;
        clip-path: polygon(0 50%, 100% 0, 72% 50%, 100% 100%);
        transform: translateY(-50%);
      }

      .hunting__arrow--fired {
        animation: arrow-flight 0.42s ease-out forwards;
      }

      @keyframes arrow-flight {
        0% {
          opacity: 1;
          transform: translate(0, 0) rotate(-12deg);
        }

        100% {
          opacity: 1;
          transform: translate(var(--arrow-x, 340px), var(--arrow-y, -180px))
            rotate(-8deg);
        }
      }

      .hunting__control {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 16px;
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 148px;
        gap: 12px;
        align-items: end;
        z-index: 2;
      }

      .hunting__meter-wrap {
        min-width: 0;
      }

      .hunting__message {
        min-height: 22px;
        margin-bottom: 8px;
        color: #365446;
        font-size: 14px;
        font-weight: 900;
        text-align: center;
        word-break: keep-all;
      }

      .hunting__meter {
        position: relative;
        height: 22px;
        overflow: hidden;
        border: 2px solid rgba(88, 103, 77, 0.34);
        border-radius: 999px;
        background:
          linear-gradient(90deg, rgba(186, 85, 62, 0.5), transparent 27% 73%, rgba(186, 85, 62, 0.5)),
          #fff9e8;
        box-shadow: inset 0 2px 5px rgba(75, 61, 40, 0.16);
      }

      .hunting__safe-zone {
        position: absolute;
        left: 44%;
        top: 0;
        width: 12%;
        height: 100%;
        background: linear-gradient(180deg, #fff0a8, var(--gold));
        box-shadow: 0 0 18px rgba(224, 174, 50, 0.55);
      }

      .hunting__marker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 28px;
        border-radius: 999px;
        background: #20322d;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.72);
        transform: translate(-50%, -50%);
      }

      .hunting__pull {
        min-height: 54px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(180deg, #63856b, var(--green));
        color: #ffffff;
        font-size: 16px;
        font-weight: 950;
        cursor: pointer;
        box-shadow: 0 12px 20px rgba(45, 74, 57, 0.22);
        touch-action: none;
        user-select: none;
      }

      .hunting__pull--active {
        background: linear-gradient(180deg, #e1b13f, #b67a25);
        transform: translateY(1px);
      }

      .hunting__pull:disabled {
        cursor: default;
        opacity: 0.46;
      }

      .dance {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(130px, 0.65fr) 1fr;
        gap: 14px;
        padding: 16px;
      }

      .dance__figure {
        position: relative;
        min-height: 100%;
        border: 1px solid rgba(75, 96, 80, 0.26);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 24%, rgba(224, 174, 50, 0.24), transparent 32%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(236, 227, 196, 0.62));
        overflow: hidden;
      }

      .dance__figure::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 13%;
        width: 132px;
        height: 28px;
        border-radius: 999px;
        background: rgba(42, 58, 49, 0.16);
        filter: blur(2px);
        transform: translateX(-50%);
      }

      .dance__figure::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 172px;
        height: 172px;
        border-radius: 999px;
        border: 3px solid rgba(224, 174, 50, 0.38);
        transform: translate(-50%, -50%);
        animation: pulse-ring 1.4s ease-in-out infinite;
      }

      .dance__dancer {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(82%, 220px);
        max-height: 92%;
        object-fit: contain;
        filter: drop-shadow(0 16px 16px rgba(39, 49, 42, 0.24));
        transform: translate(-50%, -50%);
        transform-origin: 50% 86%;
      }

      .dance__spark {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #e0ae32;
        box-shadow:
          34px -28px 0 rgba(224, 174, 50, 0.5),
          -38px 20px 0 rgba(73, 116, 94, 0.45),
          48px 38px 0 rgba(62, 116, 140, 0.42);
        opacity: 0.6;
        animation: spark-float 1.2s ease-in-out infinite;
      }

      .dance__spark--one {
        left: 22%;
        top: 26%;
      }

      .dance__spark--two {
        right: 24%;
        bottom: 28%;
        animation-delay: 0.36s;
      }

      .dance__figure--active .dance__dancer {
        animation: dancer-step 0.82s ease-in-out infinite;
      }

      @keyframes dancer-step {
        0% {
          transform: translate(-52%, -50%) rotate(-7deg) scaleX(0.98);
        }

        25% {
          transform: translate(-48%, -53%) rotate(5deg) scaleX(1.02);
        }

        50% {
          transform: translate(-51%, -48%) rotate(-3deg) scaleX(1);
        }

        75% {
          transform: translate(-49%, -54%) rotate(7deg) scaleX(1.02);
        }

        100% {
          transform: translate(-52%, -50%) rotate(-7deg) scaleX(0.98);
        }
      }

      @keyframes spark-float {
        0%,
        100% {
          transform: translateY(0) scale(0.88);
          opacity: 0.42;
        }

        50% {
          transform: translateY(-8px) scale(1.08);
          opacity: 0.72;
        }
      }

      @keyframes pulse-ring {
        0%,
        100% {
          opacity: 0.22;
          transform: translate(-50%, -50%) scale(0.94);
        }

        50% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      .dance__panel {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
      }

      .dance__sequence {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-content: flex-start;
        min-height: 136px;
        max-height: 144px;
        overflow: auto;
        padding: 8px;
        border: 1px solid rgba(136, 114, 63, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
      }

      .dance__step {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #fff9e8;
        border: 2px solid #d8c995;
        color: var(--green);
        font-size: 19px;
        font-weight: 950;
      }

      .dance__step--done {
        background: #dfead7;
        border-color: #6f9a76;
        color: #2f695d;
      }

      .dance__pad {
        display: grid;
        grid-template-columns: repeat(3, minmax(58px, 1fr));
        grid-template-rows: repeat(3, minmax(50px, 1fr));
        gap: 8px;
        align-self: stretch;
      }

      .dance__button {
        min-height: 54px;
        border: 2px solid #d8c995;
        border-radius: 8px;
        background: #fff9e8;
        color: #385747;
        font-size: 25px;
        font-weight: 950;
        cursor: pointer;
      }

      .dance__button:hover,
      .dance__button:focus-visible {
        background: #fff1b9;
        outline: 0;
      }

      .dance__button:disabled {
        opacity: 0.44;
        cursor: default;
      }

      .dance__button--up {
        grid-column: 2;
        grid-row: 1;
      }

      .dance__button--left {
        grid-column: 1;
        grid-row: 2;
      }

      .dance__button--right {
        grid-column: 3;
        grid-row: 2;
      }

      .dance__button--down {
        grid-column: 2;
        grid-row: 3;
      }

      .game__overlay {
        position: absolute;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(32, 50, 45, 0.34);
      }

      .game__overlay[hidden] {
        display: none;
      }

      .game__result {
        width: min(420px, 100%);
        border: 2px solid rgba(216, 201, 149, 0.9);
        border-radius: 8px;
        background: rgba(255, 249, 232, 0.96);
        padding: 18px;
        text-align: center;
        box-shadow: 0 16px 28px rgba(26, 39, 33, 0.22);
      }

      .game__result-title {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 28px;
        font-weight: 950;
      }

      .game__result-message {
        margin: 0;
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
        line-height: 1.5;
        word-break: keep-all;
      }

      .game__actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 15px;
      }

      .game__button {
        min-width: 96px;
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: var(--green);
        color: #ffffff;
        font-size: 14px;
        font-weight: 950;
        cursor: pointer;
      }

      .game__button--secondary {
        background: #efe6bd;
        color: #43574b;
        border: 1px solid rgba(111, 96, 62, 0.2);
      }

      .game__button:hover,
      .game__close:hover {
        filter: brightness(1.04);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        .game {
          padding: 8px;
        }

        .game__header {
          padding: 14px 14px 8px;
        }

        .game__title {
          font-size: 22px;
        }

        .game__subtitle {
          font-size: 12px;
        }

        .game__hud {
          grid-template-columns: 1fr 1fr;
          padding: 0 14px 10px;
        }

        .game__stat {
          min-height: 46px;
        }

        .game__body {
          height: calc(100% - 178px);
          min-height: 260px;
          margin: 0 14px 14px;
        }

        .game__target {
          width: 76px;
          height: 76px;
          font-size: 13px;
        }

        .hunting__control {
          left: 10px;
          right: 10px;
          bottom: 10px;
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .hunting__message {
          min-height: 18px;
          margin-bottom: 6px;
          font-size: 12px;
        }

        .hunting__pull {
          min-height: 42px;
          font-size: 14px;
        }

        .dance {
          grid-template-columns: 1fr;
          grid-template-rows: 132px 1fr;
          padding: 10px;
        }

        .dance__figure::before {
          width: 94px;
          height: 18px;
        }

        .dance__figure::after {
          width: 116px;
          height: 116px;
        }

        .dance__dancer {
          width: min(76%, 148px);
        }

        .dance__sequence {
          min-height: 102px;
          max-height: 110px;
          gap: 5px;
          padding: 6px;
        }

        .dance__step {
          width: 27px;
          height: 27px;
          border-radius: 7px;
          font-size: 15px;
        }

        .dance__button {
          min-height: 44px;
          font-size: 22px;
        }
      }

      .game {
        padding: 14px;
      }

      .game__shell {
        border-color: rgba(68, 84, 70, 0.34);
        background:
          linear-gradient(180deg, rgba(255, 253, 244, 0.96), rgba(229, 238, 224, 0.94)),
          repeating-linear-gradient(
            135deg,
            rgba(108, 129, 97, 0.04) 0,
            rgba(108, 129, 97, 0.04) 2px,
            transparent 2px,
            transparent 11px
          );
        box-shadow:
          0 18px 34px rgba(24, 41, 34, 0.22),
          0 2px 0 rgba(255, 255, 255, 0.75) inset,
          0 -16px 28px rgba(66, 94, 75, 0.09) inset;
      }

      .game__shell::before {
        inset: 9px;
        border-color: rgba(255, 255, 255, 0.82);
      }

      .game__shell::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        top: 72px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(94, 118, 96, 0.24),
          rgba(210, 163, 55, 0.36),
          rgba(94, 118, 96, 0.24),
          transparent
        );
        pointer-events: none;
      }

      .game__header {
        align-items: center;
        padding: 30px 54px 8px;
        text-align: center;
      }

      .game__header > div {
        min-width: 0;
      }

      .game__eyebrow {
        margin: 0 auto;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(216, 229, 209, 0.88));
        border: 1px solid rgba(70, 104, 80, 0.18);
        box-shadow:
          0 5px 12px rgba(44, 70, 56, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        letter-spacing: 0;
      }

      .game__title {
        margin-top: 7px;
        font-size: 28px;
        color: #172d25;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.78);
        word-break: keep-all;
      }

      .game__subtitle {
        color: #63736a;
        word-break: keep-all;
      }

      .game__close {
        position: absolute;
        top: 16px;
        right: 18px;
        background:
          linear-gradient(180deg, #ffffff, #eaf1e7);
        box-shadow:
          0 8px 18px rgba(32, 50, 42, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }

      .game__hud {
        gap: 10px;
        padding: 0 20px 12px;
      }

      .game__stat {
        min-height: 54px;
        border: 1px solid rgba(83, 112, 88, 0.2);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(237, 244, 232, 0.74));
        box-shadow:
          0 7px 16px rgba(35, 55, 45, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }

      .game__stat-label {
        color: #75837b;
      }

      .game__stat-value {
        color: #1a332b;
      }

      .game__body {
        height: calc(100% - 182px);
      }

      .game__stage {
        border-color: rgba(70, 89, 73, 0.28);
        background:
          linear-gradient(180deg, #e9efe3 0%, #d8e4d2 42%, #b78f5f 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.62),
          inset 0 -18px 28px rgba(77, 55, 42, 0.18);
      }

      [data-hunting-stage] {
        background:
          linear-gradient(180deg, #dceee8 0 32%, #c8ddbf 33% 54%, #bea169 55% 100%);
      }

      [data-hunting-stage]::before {
        height: 44%;
        background:
          linear-gradient(170deg, transparent 0 26%, rgba(72, 97, 67, 0.22) 27% 31%, transparent 32% 100%),
          repeating-linear-gradient(
            90deg,
            rgba(89, 70, 44, 0.13) 0,
            rgba(89, 70, 44, 0.13) 2px,
            transparent 2px,
            transparent 30px
          ),
          linear-gradient(180deg, rgba(190, 152, 84, 0.14), rgba(95, 63, 43, 0.3));
      }

      [data-hunting-stage]::after {
        content: "";
        position: absolute;
        left: -3%;
        right: -3%;
        top: 28%;
        height: 24%;
        background:
          linear-gradient(142deg, transparent 0 48%, rgba(80, 110, 82, 0.24) 49% 52%, transparent 53% 100%),
          linear-gradient(35deg, transparent 0 50%, rgba(79, 111, 92, 0.28) 51% 54%, transparent 55% 100%);
        opacity: 0.9;
        pointer-events: none;
      }

      [data-dance-stage] {
        background:
          linear-gradient(180deg, #f3e8c9 0 44%, #d9c18d 45% 100%);
      }

      [data-dance-stage]::before {
        height: 56%;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(111, 85, 49, 0.16) 0,
            rgba(111, 85, 49, 0.16) 2px,

                <span class="dance__spark dance__spark--two"></span>
                <span class="dance__spark dance__spark--three"></span>
                <span class="dance__spark dance__spark--four"></span>
                <img
                  class="dance__dancer"
                  src="https://rid.gcdn.ntruss.com/zep-script/seoul_2/npc/dancer.png"
                  alt=""
                />
              </div>
              <div class="dance__panel">
                <div class="dance__sequence" data-sequence></div>
                <div class="dance__pad">
                  <button
                    class="dance__button dance__button--up"
                    type="button"
                    data-direction="up"
                  >
                    ↑
                  </button>
                  <button
                    class="dance__button dance__button--left"
                    type="button"
                    data-direction="left"
                  >
                    ←
                  </button>
                  <button
                    class="dance__button dance__button--right"
                    type="button"
                    data-direction="right"
                  >
                    →
                  </button>
                  <button
                    class="dance__button dance__button--down"
                    type="button"
                    data-direction="down"
                  >
                    ↓
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="game__overlay" data-overlay>
            <div class="game__result">
              <h2 class="game__result-title" data-result-title>준비</h2>
              <p class="game__result-message" data-result-message>
                시작 버튼을 누르면 게임이 시작됩니다.
              </p>
              <div class="game__actions">
                <button class="game__button" type="button" data-start>시작</button>
                <button
                  class="game__button game__button--secondary"
                  type="button"
                  data-progress
                  hidden
                >
                  진행률
                </button>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script>
      (function () {
        const HUNTING_BACKGROUND_FILE = "images/hunting-meadow-bg.png";
        const TARGETS = [
          {
            key: "deer",
            name: "사슴",
            icon: "🦌",
            imageFile: "images/hunting-targets/deer.png",
            spriteFile: "images/hunting-targets/deer-run.webp",
          },
          {
            key: "boar",
            name: "멧돼지",
            icon: "🐗",
            imageFile: "images/hunting-targets/boar.png",
            spriteFile: "images/hunting-targets/boar-run.webp",
          },
          {
            key: "tiger",
            name: "호랑이",
            icon: "🐯",
            imageFile: "images/hunting-targets/tiger.png",
            spriteFile: "images/hunting-targets/tiger-run.webp",
          },
          {
            key: "pheasant",
            name: "꿩",
            icon: "🐦",
            imageFile: "images/hunting-targets/pheasant.png",
            spriteFile: "images/hunting-targets/pheasant-run.webp",
          },
        ];
        const TIMING_HIT_MIN = 45.5;
        const TIMING_HIT_MAX = 54.5;
        const MIN_DRAW_PERCENT = 3;
        const MAX_PULL_PIXELS = 136;
        const TIMING_SWEEP_DURATION_MS = 1180;
        const DRAW_EVENT_OPTIONS = { passive: false };
        const DIRECTION_LABELS = {
          left: "←",
          up: "↑",
          right: "→",
          down: "↓",
        };
        const DANCE_MOVE_CLASSES = [
          "dance__figure--step-left",
          "dance__figure--step-up",
          "dance__figure--step-right",
          "dance__figure--step-down",
          "dance__figure--combo",
          "dance__figure--combo-right",
          "dance__figure--combo-left",
        ];

        const titleElement = document.querySelector("[data-title]");
        const subtitleElement = document.querySelector("[data-subtitle]");
        const modeLabelElement = document.querySelector("[data-mode-label]");
        const goalElement = document.querySelector("[data-goal]");
        const currentElement = document.querySelector("[data-current]");
        const timeElement = document.querySelector("[data-time]");
        const huntingStageElement = document.querySelector("[data-hunting-stage]");
        const danceStageElement = document.querySelector("[data-dance-stage]");
        const targetElement = document.querySelector("[data-target]");
        const targetAnimalElement = document.querySelector("[data-target-animal]");
        const targetSpriteElement = document.querySelector("[data-target-sprite]");
        const targetImageElement = document.querySelector("[data-target-image]");
        const targetNameElement = document.querySelector("[data-target-name]");
        const arrowElement = document.querySelector("[data-arrow]");
        const impactArrowElement = document.querySelector("[data-impact-arrow]");
        const impactBurstElement = document.querySelector("[data-impact-burst]");
        const drawZoneElement = document.querySelector("[data-draw-zone]");
        const pullHintElement = document.querySelector("[data-pull-hint]");
        const bowElement = document.querySelector("[data-bow-control]");
        const pullFillElement = document.querySelector("[data-pull-fill]");
        const timingMarkerElement = document.querySelector("[data-timing-marker]");
        const timingTriggerElement = timingMarkerElement.closest(".hunting__trigger");
        const huntingMessageElement = document.querySelector("[data-hunting-message]");
        const danceFigureElement = document.querySelector("[data-dance-figure]");
        const sequenceElement = document.querySelector("[data-sequence]");
        const overlayElement = document.querySelector("[data-overlay]");
        const resultTitleElement = document.querySelector("[data-result-title]");
        const resultMessageElement = document.querySelector("[data-result-message]");
        const startButton = document.querySelector("[data-start]");
        const progressButton = document.querySelector("[data-progress]");
        const closeButton = document.querySelector("[data-close]");
        const directionButtons = Array.from(
          document.querySelectorAll("[data-direction]")
        );

        let payload = null;
        let timer = null;
        let targetFrame = null;
        let aimFrame = null;
        let danceMoveTimer = null;
        let dancePauseTimer = null;
        let autoStartTimer = null;
        let secondsLeft = 0;
        let score = 0;
        let danceIndex = 0;
        let running = false;
        let completed = false;
        let isDrawing = false;
        let shotLocked = false;
        let danceInputLocked = false;
        let drawPointerId = null;
        let lastTouchInputAt = 0;
        let drawStartY = 0;
        let drawMoved = false;
        let pullHintDismissed = false;
        let pullPercent = 0;
        let timingPercent = 50;
        let timingMotionStartedAt = 0;
        let targetMotionStartedAt = 0;
        let targetPosition = { x: 50, y: 42 };

        function sanitizeText(value, fallback) {
          return typeof value === "string" && value.trim()
            ? value.trim()
            : fallback;
        }

        function clearTimer() {
          if (timer !== null) {
            window.clearInterval(timer);
            timer = null;
          }
        }

        function clearTargetMotion() {
          if (targetFrame !== null) {
            window.cancelAnimationFrame(targetFrame);
            targetFrame = null;
          }
        }

        function clearAimMotion() {
          if (aimFrame !== null) {
            window.cancelAnimationFrame(aimFrame);
            aimFrame = null;
          }
        }

        function clearDanceMoveTimer() {
          if (danceMoveTimer !== null) {
            window.clearTimeout(danceMoveTimer);
            danceMoveTimer = null;
          }
        }

        function clearDancePauseTimer() {
          if (dancePauseTimer !== null) {
            window.clearTimeout(dancePauseTimer);
            dancePauseTimer = null;
          }
        }

        function clearAutoStartTimer() {
          if (autoStartTimer !== null) {
            window.clearTimeout(autoStartTimer);
            autoStartTimer = null;
          }
        }

        function clearGameMotion() {
          clearTargetMotion();
          clearAimMotion();
          clearDanceMoveTimer();
          clearDancePauseTimer();
          clearAutoStartTimer();
        }

        function resetDanceMoveClasses() {
          danceFigureElement.classList.remove.apply(
            danceFigureElement.classList,
            DANCE_MOVE_CLASSES
          );
        }

        function playDanceMove(direction, isComboMove, comboDirection) {
          clearDanceMoveTimer();
          resetDanceMoveClasses();
          void danceFigureElement.offsetWidth;

          if (isComboMove) {
            danceFigureElement.classList.add("dance__figure--combo");
            danceFigureElement.classList.add(
              comboDirection === "left"
                ? "dance__figure--combo-left"
                : "dance__figure--combo-right"
            );
          } else {
            danceFigureElement.classList.add(`dance__figure--step-${direction}`);
          }

          danceMoveTimer = window.setTimeout(function () {
            danceMoveTimer = null;
            resetDanceMoveClasses();
          }, isComboMove ? 1680 : 760);
        }

        function pulseDirectionButton(direction) {
          const button = directionButtons.find(function (candidate) {
            return candidate.getAttribute("data-direction") === direction;
          });

          if (!button || button.disabled) {
            return;
          }

          button.classList.remove("dance__button--pressed");
          void button.offsetWidth;
          button.classList.add("dance__button--pressed");
          window.setTimeout(function () {
            button.classList.remove("dance__button--pressed");
          }, 160);
        }

        function pauseDanceForCombo(onDone) {
          clearDancePauseTimer();
          danceInputLocked = true;
          setDirectionButtonsEnabled(false);
          dancePauseTimer = window.setTimeout(function () {
            dancePauseTimer = null;

            if (!running || payload?.mode !== "dance") {
              danceInputLocked = false;
              return;
            }

            if (typeof onDone === "function") {
              danceInputLocked = false;
              onDone();
              return;
            }

            danceInputLocked = false;
            setDirectionButtonsEnabled(true);
          }, 1560);
        }

        function post(type) {
          window.parent?.postMessage({ type }, "*");
        }

        function updateHud() {
          if (!payload) {
            goalElement.textContent = "-";
            currentElement.textContent = "-";
            timeElement.textContent = "-";
            return;
          }

          if (payload.mode === "hunting") {
            goalElement.textContent = `${payload.targetScore}발`;
            currentElement.textContent = `${score}발`;
            timeElement.textContent = `${secondsLeft}초`;
            return;
          }

          goalElement.textContent = `${payload.sequence.length}동작`;
          currentElement.textContent = `${danceIndex}/${payload.sequence.length}`;
          timeElement.textContent = "순서";
        }

        function showOverlay(title, message, startText, showProgress) {
          resultTitleElement.textContent = title;
          resultMessageElement.textContent = message;
          startButton.textContent = startText;
          progressButton.hidden = !showProgress;
          overlayElement.hidden = false;
        }

        function hideOverlay() {
          overlayElement.hidden = true;
        }

        function renderSequence() {
          sequenceElement.replaceChildren();
          const sequence = Array.isArray(payload?.sequence) ? payload.sequence : [];
          sequence.forEach(function (direction, index) {
            const step = document.createElement("div");
            step.className = "dance__step";
            step.dataset.index = String(index + 1);
            step.dataset.row = index < 10 ? "1" : "2";
            if (index < danceIndex) {
              step.classList.add("dance__step--done");
            }
            if (running && index === danceIndex) {
              step.classList.add("dance__step--current");
            }
            step.textContent = DIRECTION_LABELS[direction] || "?";
            sequenceElement.appendChild(step);
          });
        }

        function setDirectionButtonsEnabled(enabled) {
          directionButtons.forEach(function (button) {
            button.disabled = !enabled;
          });
        }

        function setHuntingMessage(message) {
          huntingMessageElement.textContent = message;
        }

        function getAppAssetUrl(fileName) {
          try {
            const url = new URL(window.location.href);
            const appHashId = url.searchParams.get("appHashId");
            const appUpdatedAt = url.searchParams.get("appUpdatedAt");

            if (appHashId) {
              const params = new URLSearchParams({
                appHashId,
                fileName,
              });

              if (appUpdatedAt) {
                params.set("appUpdatedAt", appUpdatedAt);
              }

              return `${url.origin}/spaces/app/file?${params.toString()}`;
            }
          } catch (error) {
            // Local previews can use the relative fallback below.
          }

          return `../${fileName}`;
        }

        function setHuntingBackground() {
          const backgroundUrl = getAppAssetUrl(HUNTING_BACKGROUND_FILE);
          huntingStageElement.style.setProperty(
            "--hunting-meadow-bg",
            `url("${backgroundUrl}")`
          );
        }

        function setTargetPosition(x, y) {
          const previousX = targetPosition.x;
          targetPosition = { x, y };
          targetElement.style.left = `${x}%`;
          targetElement.style.top = `${y}%`;

          if (Math.abs(x - previousX) > 0.04) {
            targetElement.setAttribute(
              "data-run-direction",
              x > previousX ? "right" : "left"
            );
          }
        }

        function setTargetName() {
          const target = TARGETS[Math.floor(Math.random() * TARGETS.length)];
          targetElement.setAttribute("data-target-key", target.key);
          targetElement.setAttribute("data-animal", target.name);
          targetElement.setAttribute("data-icon", target.icon);
          targetAnimalElement.textContent = target.name;
          targetAnimalElement.setAttribute("data-icon", target.icon);
          const spriteUrl = getAppAssetUrl(target.spriteFile);
          targetSpriteElement.style.setProperty("--animal-sprite", `url("${spriteUrl}")`);
          targetImageElement.src = spriteUrl;
          targetImageElement.alt = target.name;
          targetNameElement.textContent = target.name;
        }

        function updateTargetMotion(timestamp) {
          if (!running || payload?.mode !== "hunting") {
            clearTargetMotion();
            return;
          }

          if (!targetMotionStartedAt) {
            targetMotionStartedAt = timestamp;
          }

          const elapsed = (timestamp - targetMotionStartedAt) / 1000;
          const isCompactStage = huntingStageElement.clientWidth <= 420;
          const x = 52 + Math.sin(elapsed * 0.78) * (isCompactStage ? 17 : 23);
          const y =
            (isCompactStage ? 32 : 39) +
            Math.abs(Math.sin(elapsed * 1.56 + 0.4)) * (isCompactStage ? -3 : -4) +
            Math.sin(elapsed * 0.42 + 1.3) * (isCompactStage ? 1 : 1.6);
          setTargetPosition(x, y);
          targetFrame = window.requestAnimationFrame(updateTargetMotion);
        }

        function startTargetMotion() {
          clearTargetMotion();
          targetMotionStartedAt = 0;
          setTargetName();
          targetElement.setAttribute("data-run-direction", "right");
          setTargetPosition(50, huntingStageElement.clientWidth <= 420 ? 32 : 39);
          targetFrame = window.requestAnimationFrame(updateTargetMotion);
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function setDrawEnabled(enabled) {
          drawZoneElement.classList.toggle("hunting__draw-zone--locked", !enabled);
          drawZoneElement.setAttribute("aria-disabled", enabled ? "false" : "true");
          drawZoneElement.tabIndex = enabled ? 0 : -1;
        }

        function setPullHintVisible(visible) {
          pullHintElement?.classList.toggle("hunting__pull-hint--hidden", !visible);
        }

        function dismissPullHint() {
          if (pullHintDismissed) {
            return;
          }

          pullHintDismissed = true;
          setPullHintVisible(false);
        }

        function updatePullVisuals() {
          const drawOffset = Math.round(pullPercent * 0.34);
          huntingStageElement.style.setProperty("--pull-percent", `${pullPercent}%`);
          huntingStageElement.style.setProperty("--draw-offset", `${drawOffset}px`);
        }

        function updateTimingVisuals() {
          const markerTop = 100 - timingPercent;
          timingMarkerElement.style.left = "50%";
          timingMarkerElement.style.top = `${markerTop}%`;
          pullFillElement.style.height = "24px";
          pullFillElement.style.top = `${markerTop}%`;
          huntingStageElement.style.setProperty("--timing-percent", `${timingPercent}%`);
          huntingStageElement.style.setProperty("--timing-top", `${markerTop}%`);
        }

        function updateTimingMotion(timestamp) {
          if (!isDrawing || !running || payload?.mode !== "hunting" || shotLocked) {
            clearAimMotion();
            return;
          }

          if (!timingMotionStartedAt) {
            timingMotionStartedAt = timestamp;
          }

          const elapsed = (timestamp - timingMotionStartedAt) % TIMING_SWEEP_DURATION_MS;
          const phase = (elapsed / TIMING_SWEEP_DURATION_MS) * Math.PI * 2;
          timingPercent = 50 + Math.sin(phase) * 45;
          updateTimingVisuals();
          aimFrame = window.requestAnimationFrame(updateTimingMotion);
        }

        function startTimingMotion() {
          clearAimMotion();
          timingMotionStartedAt = 0;
          timingTriggerElement.classList.add("hunting__trigger--active");
          aimFrame = window.requestAnimationFrame(updateTimingMotion);
        }

        function resetAimMarker() {
          pullPercent = 0;
          drawMoved = false;
          timingPercent = 50;
          timingMotionStartedAt = 0;
          clearAimMotion();
          updatePullVisuals();
          updateTimingVisuals();
          drawZoneElement.classList.remove("hunting__draw-zone--drawing");
          arrowElement.classList.remove("hunting__arrow--spent");
          arrowElement.classList.remove("hunting__arrow--miss");
          timingTriggerElement.classList.remove("hunting__trigger--active");
          clearImpactArrow();
        }

        function clearImpactArrow() {
          impactArrowElement.classList.remove("hunting__impact-arrow--shown");
          impactBurstElement.classList.remove("hunting__impact-burst--shown");
        }

        function showImpactArrow() {
          const stageRect = huntingStageElement.getBoundingClientRect();
          const targetRect = targetElement.getBoundingClientRect();
          const impactX = targetRect.left - stageRect.left + targetRect.width / 2;
          const impactY = targetRect.top - stageRect.top + targetRect.height / 2;
          const impactXValue = `${Math.round(impactX)}px`;
          const impactYValue = `${Math.round(impactY)}px`;

          impactArrowElement.style.setProperty("--impact-x", impactXValue);
          impactArrowElement.style.setProperty("--impact-y", impactYValue);
          impactBurstElement.style.setProperty("--impact-x", impactXValue);
          impactBurstElement.style.setProperty("--impact-y", impactYValue);
          clearImpactArrow();
          void impactArrowElement.offsetWidth;
          impactArrowElement.classList.add("hunting__impact-arrow--shown");
          impactBurstElement.classList.add("hunting__impact-burst--shown");
        }

        function fireArrow(hit, shotTimingPercent) {
          if (hit) {
            clearTargetMotion();
          }

          const stageRect = huntingStageElement.getBoundingClientRect();
          const originX = stageRect.width * 0.5;
          const originY = stageRect.height * 0.74;
          const targetX = stageRect.width * (targetPosition.x / 100);
          const targetY = stageRect.height * (targetPosition.y / 100);
          const missDirection = shotTimingPercent < TIMING_HIT_MIN ? -1 : 1;
          const missX = targetX + stageRect.width * (stageRect.width <= 420 ? 0.2 : 0.24) * missDirection;
          const missY = targetY + (shotTimingPercent < TIMING_HIT_MIN ? 58 : -52);
          const endX = hit ? targetX : missX;
          const endY = hit ? targetY : missY;
          const curveX = (endX - originX) * 0.52 + stageRect.width * 0.08 * missDirection;
          const curveY = (endY - originY) * 0.58 - (hit ? 0 : 36);
          const trajectoryAngle = clamp(
            (Math.atan2(endX - originX, Math.max(80, originY - endY)) * 180) /
              Math.PI,
            -20,
            20
          );
          const arrowAngle = hit ? trajectoryAngle : trajectoryAngle + missDirection * 9;
          const arrowMidAngle = arrowAngle * 0.58;
          const missRotate = `${arrowAngle}deg`;
          const missMidRotate = `${arrowMidAngle}deg`;
          arrowElement.style.setProperty("--arrow-x", `${endX - originX}px`);
          arrowElement.style.setProperty("--arrow-y", `${endY - originY}px`);
          arrowElement.style.setProperty("--arrow-mid-x", `${curveX}px`);
          arrowElement.style.setProperty("--arrow-mid-y", `${curveY}px`);
          arrowElement.style.setProperty("--arrow-miss-rotate", missRotate);
          arrowElement.style.setProperty("--arrow-miss-mid-rotate", missMidRotate);
          arrowElement.style.setProperty("--arrow-angle", `${arrowAngle}deg`);
          arrowElement.style.setProperty("--arrow-mid-angle", `${arrowMidAngle}deg`);
          impactArrowElement.style.setProperty("--impact-angle", `${trajectoryAngle}deg`);
          arrowElement.classList.remove("hunting__arrow--fired");
          arrowElement.classList.remove("hunting__arrow--spent");
          arrowElement.classList.remove("hunting__arrow--miss");
          targetElement.classList.remove("game__target--hit");
          void arrowElement.offsetWidth;
          if (!hit) {
            arrowElement.classList.add("hunting__arrow--miss");
          }
          arrowElement.classList.add("hunting__arrow--fired");
          clearImpactArrow();

          if (hit) {
            window.setTimeout(function () {
              arrowElement.classList.remove("hunting__arrow--fired");
              arrowElement.classList.add("hunting__arrow--spent");
              showImpactArrow();
              targetElement.classList.add("game__target--hit");
            }, 500);

            window.setTimeout(function () {
              targetElement.classList.remove("game__target--hit");
            }, 760);
          }
        }

        function completeGame(title, message) {
          if (completed) {
            return;
          }

          completed = true;
          running = false;
          isDrawing = false;
          shotLocked = false;
          danceInputLocked = false;
          clearTimer();
          clearGameMotion();
          setDrawEnabled(false);
          setPullHintVisible(false);
          resetAimMarker();
          setDirectionButtonsEnabled(false);
          resetDanceMoveClasses();
          danceFigureElement.classList.remove("dance__figure--active");
          showOverlay(title, message, "다시 하기", true);
          post("mission-game:complete");
        }

        function failGame(title, message) {
          running = false;
          isDrawing = false;
          shotLocked = false;
          danceInputLocked = false;
          clearTimer();
          clearGameMotion();
          setDrawEnabled(false);
          setPullHintVisible(false);
          resetAimMarker();
          setDirectionButtonsEnabled(false);
          resetDanceMoveClasses();
          danceFigureElement.classList.remove("dance__figure--active");
          showOverlay(title, message, "다시 도전", false);
        }

        function tickHunting() {
          secondsLeft -= 1;
          updateHud();

          if (secondsLeft > 0) {
            return;
          }

          if (score >= payload.targetScore) {
            completeGame("명중!", "목표를 달성했습니다. 고두가 크게 웃고 있습니다.");
            return;
          }

          failGame("아쉽다!", "시간 안에 표적을 더 맞혀야 합니다.");
        }

        function startHunting() {
          score = 0;
          secondsLeft = Number(payload.durationSeconds) || 30;
          running = true;
          completed = false;
          danceInputLocked = false;
          isDrawing = false;
          shotLocked = false;
          pullHintDismissed = false;
          setDrawEnabled(true);
          setPullHintVisible(true);
          setHuntingMessage("시위를 당기면 왼쪽 포인터가 움직입니다. 진한 구간에서 놓으세요.");
          resetAimMarker();
          hideOverlay();
          startTargetMotion();
          updateHud();
          clearTimer();
          timer = window.setInterval(tickHunting, 1000);
        }

        function startDance() {
          danceIndex = 0;
          running = true;
          completed = false;
          clearGameMotion();
          resetDanceMoveClasses();
          setPullHintVisible(false);
          hideOverlay();
          setDirectionButtonsEnabled(true);
          danceFigureElement.classList.add("dance__figure--active");
          renderSequence();
          updateHud();
        }

        function startGame() {
          if (!payload) {
            return;
          }

          clearAutoStartTimer();

          if (payload.mode === "hunting") {
            startHunting();
            return;
          }

          startDance();
        }

        function queueAutoStart() {
          clearAutoStartTimer();
          autoStartTimer = window.setTimeout(function () {
            autoStartTimer = null;

            if (!payload || running || completed) {
              return;
            }

            startGame();
          }, 120);
        }

        function getDrawClientY(event) {
          if (event?.touches?.length) {
            return event.touches[0].clientY;
          }

          if (event?.changedTouches?.length) {
            return event.changedTouches[0].clientY;
          }

          if (typeof event?.clientY === "number") {
            return event.clientY;
          }

          return null;
        }

        function isTouchLikeDrawEvent(event) {
          return (
            event?.type?.indexOf("touch") === 0 ||
            event?.pointerType === "touch" ||
            event?.pointerType === "pen"
          );
        }

        function markTouchLikeInput(event) {
          if (isTouchLikeDrawEvent(event)) {
            lastTouchInputAt = Date.now();
          }
        }

        function getDrawInputId(event) {
          if (isTouchLikeDrawEvent(event)) {
            return "touch";
          }

          if (typeof event?.pointerId === "number") {
            return `pointer:${event.pointerId}`;
          }

          return "mouse";
        }

        function isSameDrawInput(event) {
          return drawPointerId === getDrawInputId(event);
        }

        function preventDrawEvent(event) {
          if (event?.cancelable !== false) {
            event?.preventDefault?.();
          }

          event?.stopPropagation?.();
        }

        function beginDraw(event) {
          if (!running || payload?.mode !== "hunting" || shotLocked) {
            return;
          }

          if (isDrawing) {
            if (isSameDrawInput(event) || isTouchLikeDrawEvent(event)) {
              preventDrawEvent(event);
              markTouchLikeInput(event);
            }
            return;
          }

          if (
            event?.type === "mousedown" &&
            Date.now() - lastTouchInputAt < 650
          ) {
            return;
          }

          const clientY = getDrawClientY(event);
          if (clientY === null) {
            return;
          }

          preventDrawEvent(event);
          markTouchLikeInput(event);
          dismissPullHint();

          isDrawing = true;
          drawPointerId = getDrawInputId(event);
          drawStartY = clientY;
          drawMoved = false;
          pullPercent = 0;
          timingPercent = 50;
          drawZoneElement.classList.add("hunting__draw-zone--drawing");
          if (typeof event?.pointerId === "number") {
            try {
              drawZoneElement.setPointerCapture?.(event.pointerId);
            } catch (error) {
              // ZEP WebView can reject pointer capture; window events handle fallback.
            }
          }
          updatePullVisuals();
          updateTimingVisuals();
          startTimingMotion();
          setHuntingMessage("왼쪽 포인터가 진한 구간에 닿는 순간 시위를 놓으세요.");
        }

        function moveDraw(event) {
          if (!isDrawing || !isSameDrawInput(event)) {
            return;
          }

          const clientY = getDrawClientY(event);
          if (clientY === null) {
            return;
          }

          preventDrawEvent(event);
          markTouchLikeInput(event);

          const distance = Math.abs(drawStartY - clientY);
          if (distance >= 3) {
            drawMoved = true;
          }
          pullPercent = clamp((distance / MAX_PULL_PIXELS) * 100, 0, 100);
          updatePullVisuals();
        }

        function releaseArrow() {
          if (!running || payload?.mode !== "hunting" || shotLocked) {
            return;
          }

          if (!drawMoved && pullPercent < MIN_DRAW_PERCENT) {
            isDrawing = false;
            drawPointerId = null;
            drawMoved = false;
            resetAimMarker();
            setHuntingMessage("시위를 조금 더 당겨 보세요.");
            return;
          }

          if (pullPercent < MIN_DRAW_PERCENT) {
            pullPercent = MIN_DRAW_PERCENT;
            updatePullVisuals();
          }

          const shotTimingPercent = timingPercent;
          const hit =
            shotTimingPercent >= TIMING_HIT_MIN &&
            shotTimingPercent <= TIMING_HIT_MAX;
          isDrawing = false;
          shotLocked = true;
          drawPointerId = null;
          clearAimMotion();
          timingTriggerElement.classList.remove("hunting__trigger--active");
          setDrawEnabled(false);
          drawZoneElement.classList.remove("hunting__draw-zone--drawing");
          drawMoved = false;
          fireArrow(hit, shotTimingPercent);

          if (hit) {
            score += 1;
            updateHud();
            setHuntingMessage("");
          } else {
            setHuntingMessage("아깝다! 포인터가 진한 구간 밖이라 화살이 휘어 나갔습니다.");
          }

          window.setTimeout(function () {
            arrowElement.classList.remove("hunting__arrow--fired");
            arrowElement.classList.remove("hunting__arrow--miss");
            resetAimMarker();

            if (!running || payload?.mode !== "hunting") {
              return;
            }

            if (score >= payload.targetScore) {
              completeGame("명중!", "제법 무사 티가 납니다. 다음 활동으로 이동하세요.");
              return;
            }

            if (hit) {
              startTargetMotion();
            }
            shotLocked = false;
            setDrawEnabled(true);
          }, 1120);
        }

        function endDraw(event) {
          if (!isDrawing || !isSameDrawInput(event)) {
            return;
          }

          preventDrawEvent(event);
          markTouchLikeInput(event);

          if (typeof event?.pointerId === "number") {
            try {
              drawZoneElement.releasePointerCapture?.(event.pointerId);
            } catch (error) {
              // Ignore release failures; some embedded browsers auto-release captures.
            }
          }
          drawPointerId = null;
          releaseArrow();
        }

        function cancelDraw(event) {
          if (drawPointerId === null) {
            return;
          }

          if (drawPointerId !== null && !isSameDrawInput(event)) {
            return;
          }

          markTouchLikeInput(event);

          if (
            running &&
            payload?.mode === "hunting" &&
            isDrawing &&
            (drawMoved || pullPercent >= MIN_DRAW_PERCENT)
          ) {
            releaseArrow();
            return;
          }

          drawPointerId = null;
          isDrawing = false;
          clearAimMotion();
          timingMotionStartedAt = 0;
          timingTriggerElement.classList.remove("hunting__trigger--active");
          drawZoneElement.classList.remove("hunting__draw-zone--drawing");
          drawMoved = false;
          resetAimMarker();
        }

        function handleDirection(direction) {
          if (!running || payload?.mode !== "dance" || danceInputLocked) {
            return;
          }

          const expected = payload.sequence[danceIndex];
          if (direction !== expected) {
            playDanceMove("down", false);
            danceIndex = 0;
            renderSequence();
            updateHud();
            failGame("발이 꼬였어요", "처음부터 다시 순서대로 밟아 보세요.");
            return;
          }

          const nextDanceIndex = danceIndex + 1;
          const isComboMove =
            nextDanceIndex % 10 === 0 ||
            nextDanceIndex >= payload.sequence.length;
          const comboDirection =
            Math.floor(nextDanceIndex / 10) % 2 === 0 ? "left" : "right";
          playDanceMove(direction, isComboMove, comboDirection);
          danceIndex = nextDanceIndex;
          renderSequence();
          updateHud();

          if (danceIndex >= payload.sequence.length) {
            pauseDanceForCombo(function () {
              completeGame("좋아!", "무희의 동작을 끝까지 따라 했습니다.");
            });
            return;
          }

          if (isComboMove) {
            pauseDanceForCombo();
          }
        }

        function applyPayload(nextPayload) {
          payload = {
            durationSeconds: Number(nextPayload?.durationSeconds) || 30,
            id: sanitizeText(nextPayload?.id, ""),
            instruction: sanitizeText(nextPayload?.instruction, ""),
            mode: nextPayload?.mode === "dance" ? "dance" : "hunting",
            sequence: Array.isArray(nextPayload?.sequence)
              ? nextPayload.sequence.filter(function (direction) {
                  return Boolean(DIRECTION_LABELS[direction]);
                })
              : [],
            subtitle: sanitizeText(nextPayload?.subtitle, ""),
            targetScore: Number(nextPayload?.targetScore) || 10,
            title: sanitizeText(nextPayload?.title, "미션 게임"),
          };

          clearTimer();
          clearGameMotion();
          running = false;
          completed = false;
          isDrawing = false;
          shotLocked = false;
          danceInputLocked = false;
          pullHintDismissed = false;
          clearAutoStartTimer();
          drawPointerId = null;
          score = 0;
          danceIndex = 0;
          secondsLeft = payload.mode === "hunting" ? payload.durationSeconds : 0;
          titleElement.textContent = payload.title;
          subtitleElement.textContent = payload.subtitle;
          modeLabelElement.textContent =
            payload.mode === "hunting" ? "수렵도" : "무용도";
          document.body.dataset.gameMode = payload.mode;
          huntingStageElement.hidden = payload.mode !== "hunting";
          danceStageElement.hidden = payload.mode !== "dance";
          setHuntingBackground();
          setDrawEnabled(false);
          setPullHintVisible(false);
          resetDanceMoveClasses();
          danceFigureElement.classList.remove("dance__figure--active");
          setTargetPosition(50, 40);
          resetAimMarker();
          setHuntingMessage("활시위를 당겨 진한 구간에서 놓으세요.");
          setDirectionButtonsEnabled(false);
          renderSequence();
          updateHud();
          showOverlay("준비", payload.instruction, "시작", false);
        }

        function handleMessage(event) {
          const data = event?.data;
          if (!data || data.type !== "mission-game:init") {
            return;
          }

          applyPayload(data.payload || {});
        }

        startButton.addEventListener("click", function (event) {
          event.stopPropagation();
          startGame();
        });

        progressButton.addEventListener("click", function (event) {
          event.stopPropagation();
          post("mission-game:show-progress");
        });

        closeButton.addEventListener("click", function (event) {
          event.stopPropagation();
          post("mission-game:close");
        });

        drawZoneElement.addEventListener("pointerdown", beginDraw);
        drawZoneElement.addEventListener("pointermove", moveDraw);
        drawZoneElement.addEventListener("pointerup", endDraw);
        drawZoneElement.addEventListener("pointercancel", cancelDraw);
        window.addEventListener("pointermove", moveDraw);
        window.addEventListener("pointerup", endDraw);
        window.addEventListener("pointercancel", cancelDraw);
        drawZoneElement.addEventListener("mousedown", beginDraw);
        window.addEventListener("mousemove", moveDraw);
        window.addEventListener("mouseup", endDraw);
        drawZoneElement.addEventListener("touchstart", beginDraw, DRAW_EVENT_OPTIONS);
        window.addEventListener("touchmove", moveDraw, DRAW_EVENT_OPTIONS);
        window.addEventListener("touchend", endDraw, DRAW_EVENT_OPTIONS);
        window.addEventListener("touchcancel", cancelDraw, DRAW_EVENT_OPTIONS);

        drawZoneElement.addEventListener("contextmenu", function (event) {
          event.preventDefault();
        });

        directionButtons.forEach(function (button) {
          button.addEventListener("click", function (event) {
            event.stopPropagation();
            const direction = button.getAttribute("data-direction") || "";
            pulseDirectionButton(direction);
            handleDirection(direction);
          });
        });

        window.addEventListener("keydown", function (event) {
          const keyMap = {
            ArrowLeft: "left",
            ArrowUp: "up",
            ArrowRight: "right",
            ArrowDown: "down",
          };
          const direction = keyMap[event.key];
          if (!direction) {
            return;
          }

          event.preventDefault();
          pulseDirectionButton(direction);
          handleDirection(direction);
        });

        window.addEventListener("message", handleMessage);
        window.addEventListener("beforeunload", function () {
          clearTimer();
          clearGameMotion();
        });
        post("mission-game:ready");
      })();
    </script>
  </body>
</html>
